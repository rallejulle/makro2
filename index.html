<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EC2211 Pluggportal</title>
  <meta name="description" content="Pluggportal för EC2211 Intermediate Macroeconomics – teori, formelblad, quiz, tentafrågor med modellsvar, provtentor, simulatorer och pluggschema.">
  <meta name="theme-color" content="#1f5f52">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5f52'/%3E%3Cpath d='M12 46 Q24 14 34 30 T54 16' stroke='%23fff' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <style>
:root {
  --bg: #f6f4ef; --surface: #fffdf9; --surface2: #efebe2; --ink: #1c2230; --muted: #5f6673;
  --line: #e2ddd2; --accent: #1f5f52; --accent-soft: #dcebe6; --accent-ink: #fff; --warm: #c2612b; --warm-soft: #f6e3d6;
  --good: #2e7d4f; --good-soft: #dff0e5; --bad: #b33a3a; --bad-soft: #f6dede; --mid: #b7860b; --mid-soft: #f7edd0;
  --s1: #1f5f52; --s2: #c2612b; --s3: #8a8f99; --s4: #3b5bb5;
  --radius: 14px; --shadow: 0 1px 2px rgba(28,34,48,.05), 0 6px 20px rgba(28,34,48,.05);
  --serif: "Fraunces", Georgia, serif; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121418; --surface: #1a1d23; --surface2: #23272f; --ink: #e9e6df; --muted: #9ba1ab; --line: #2f343d;
  --accent: #62b6a1; --accent-soft: #1d3530; --accent-ink: #0d1412; --warm: #e58c57; --warm-soft: #3a2619;
  --good: #5cc488; --good-soft: #193524; --bad: #ec7b7b; --bad-soft: #3d1f1f; --mid: #e3b84a; --mid-soft: #3a3016;
  --s1: #62b6a1; --s2: #e58c57; --s3: #8f96a1; --s4: #8ea8f2; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1a1d23; --surface2: #23272f; --ink: #e9e6df; --muted: #9ba1ab; --line: #2f343d;
  --accent: #62b6a1; --accent-soft: #1d3530; --accent-ink: #0d1412; --warm: #e58c57; --warm-soft: #3a2619;
  --good: #5cc488; --good-soft: #193524; --bad: #ec7b7b; --bad-soft: #3d1f1f; --mid: #e3b84a; --mid-soft: #3a3016;
  --s1: #62b6a1; --s2: #e58c57; --s3: #8f96a1; --s4: #8ea8f2; color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.6 var(--sans); }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; line-height: 1.25; margin: 0 0 .5em; letter-spacing: -.01em; }
h1 { font-size: 2rem; } h2 { font-size: 1.45rem; } h3 { font-size: 1.15rem; margin-top: 1.2em; } h4 { font-size: 1rem; font-family: var(--sans); font-weight: 650; }
p { margin: .4em 0 .8em; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
code, kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; background: var(--surface2); padding: 1px 5px; border-radius: 5px; }

/* Layout */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.app > div { min-width: 0; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { font-family: var(--serif); font-size: 1.25rem; font-weight: 650; padding: 0 10px 2px; }
.brand small { display: block; font-family: var(--sans); font-size: .75rem; font-weight: 500; color: var(--muted); }
.count { margin: 14px 8px 18px; padding: 12px 14px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); }
.count b { font-family: var(--serif); font-size: 1.7rem; display: block; line-height: 1.1; }
.count span { font-size: .8rem; opacity: .9; }
nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--ink); text-decoration: none; font-size: .93rem; }
nav a:hover { background: var(--surface2); }
nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav .ico { width: 20px; text-align: center; opacity: .85; }
.side-foot { margin-top: 18px; padding: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
main { padding: 34px clamp(16px, 4vw, 48px) 80px; max-width: 1080px; width: 100%; }
.topbar { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { display: block; position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 4px; }
  .topbar .brand { padding: 0; font-size: 1.05rem; }
  .topbar .pill { background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 2px 10px; font-size: .8rem; font-weight: 600; }
  .topbar nav { display: flex; overflow-x: auto; gap: 2px; padding: 4px 10px 8px; scrollbar-width: none; }
  .topbar nav::-webkit-scrollbar { display: none; }
  .topbar nav a { white-space: nowrap; padding: 6px 10px; font-size: .85rem; }
  main { padding: 20px 16px 80px; }
  h1 { font-size: 1.55rem; }
}

/* Components */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 16px; min-width: 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 860px) { .g2, .g3 { grid-template-columns: 1fr; } .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { padding: 14px 16px; }
.stat .v { font-family: var(--serif); font-size: 1.8rem; font-weight: 600; line-height: 1.1; }
.stat .l { font-size: .8rem; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 13px; border-radius: 9px; font: inherit; font-size: .9rem; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.warm { background: var(--warm); border-color: var(--warm); color: #fff; }
.btn.sm { padding: 4px 9px; font-size: .8rem; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 14px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; font-size: .82rem; cursor: pointer; color: var(--ink); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tag { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); }
.tag.flod { background: var(--accent-soft); color: var(--accent); }
.tag.prog { background: var(--warm-soft); color: var(--warm); }
.tag.pts { background: var(--mid-soft); color: var(--mid); }
input[type="text"], input[type="search"], input[type="number"], textarea, select {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea { width: 100%; min-height: 120px; resize: vertical; line-height: 1.5; }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; margin: 8px 0 12px; }
.tbl th, .tbl td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.tbl.num td { font-variant-numeric: tabular-nums; }
.tbl tr.hl td { background: var(--accent-soft); }
.scrollx { overflow-x: auto; }
.tip { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; }
.warn { background: var(--warm-soft); border-radius: 10px; padding: 10px 14px; }
details { border-top: 1px solid var(--line); }
details > summary { cursor: pointer; padding: 12px 2px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "+"; color: var(--muted); font-weight: 400; }
details[open] > summary::after { content: "–"; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.hero { display: flex; justify-content: space-between; gap: 18px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
.hero p { margin: 0; color: var(--muted); }

/* Heatmap */
.heat { border-collapse: separate; border-spacing: 3px; font-size: .78rem; width: 100%; }
.heat th { font-weight: 600; color: var(--muted); text-align: center; padding: 2px; }
.heat th.tn { text-align: left; color: var(--ink); white-space: nowrap; font-weight: 500; }
.heat td { text-align: center; border-radius: 6px; padding: 5px 2px; min-width: 34px; font-variant-numeric: tabular-nums; }
.heat .flodcol { box-shadow: inset 0 -2px 0 var(--accent); }

/* Schedule */
.day { border-left: 3px solid var(--line); padding: 2px 0 2px 16px; margin-bottom: 20px; }
.day.today { border-color: var(--warm); }
.day.past { opacity: .65; }
.day h3 { margin: 0 0 4px; }
.task { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.task input { margin-top: 5px; accent-color: var(--accent); width: 17px; height: 17px; flex: none; }
.task.done span { text-decoration: line-through; color: var(--muted); }

/* Quiz */
.opt { display: block; width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 11px; padding: 11px 14px; margin: 8px 0; cursor: pointer; font: inherit; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.expl { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: var(--surface2); }
.kbdhint { font-size: .78rem; color: var(--muted); }

/* Exam questions */
.q-head { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.model { margin-top: 12px; padding: 14px 16px; border-radius: 12px; background: var(--surface2); border-left: 3px solid var(--accent); }
.keys label { display: flex; gap: 9px; padding: 4px 0; cursor: pointer; }
.keys input { accent-color: var(--accent); margin-top: 4px; }
.score { font-weight: 700; }

/* Flashcards */
.flash { perspective: 1200px; cursor: pointer; min-height: 230px; }
.flash .inner { position: relative; min-height: 230px; transition: transform .45s; transform-style: preserve-3d; }
.flash.flip .inner { transform: rotateY(180deg); }
.flash .face { position: absolute; inset: 0; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 26px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.flash .back { transform: rotateY(180deg); background: var(--accent-soft); }
.flash .term { font-family: var(--serif); font-size: 1.5rem; }

/* Formulas */
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.fcard .fn { font-weight: 600; font-size: .9rem; display: flex; justify-content: space-between; gap: 8px; }
.fcard .ftex { margin: 6px 0; min-height: 44px; display: flex; align-items: center; overflow-x: auto; }
.fcard.hidden .ftex { filter: blur(7px); cursor: pointer; }
.fcard .fw { font-size: .82rem; color: var(--muted); }

/* Charts */
.chart { width: 100%; height: auto; display: block; font-family: var(--sans); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 11px; }
.chart .lbl { fill: var(--muted); font-size: 12px; }
.chart .lbl.small { font-size: 11px; }
.chart .axis { stroke: var(--muted); stroke-width: 1.2; }
.chart .zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .vline { stroke: var(--warm); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .hline { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.chart .hline.faint { opacity: .6; }
.chart .line { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.s1 { stroke: var(--s1); } .chart .line.s2 { stroke: var(--s2); } .chart .line.s3 { stroke: var(--s3); } .chart .line.s4 { stroke: var(--s4); }
.chart .slbl { font-size: 12px; font-weight: 600; } .chart .slbl.s1 { fill: var(--s1); } .chart .slbl.s2 { fill: var(--s2); }
.chart .pt { fill: var(--surface); stroke: var(--ink); stroke-width: 2; } .chart .pt.new { stroke: var(--warm); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: 4px; }
.legend .sw { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend .sw.s1 { background: var(--s1); } .legend .sw.s2 { background: var(--s2); } .legend .sw.s3 { background: var(--s3); } .legend .sw.s4 { background: var(--s4); }
.legend .sw.dashed { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px); color: var(--muted); }
.sim-controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
.sim-controls label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; }
.sim-controls input[type=range] { accent-color: var(--accent); width: 100%; }
.sim-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 860px) { .sim-grid { grid-template-columns: 1fr; } }

/* Timer */
.timer { font-family: var(--serif); font-size: 2.2rem; font-variant-numeric: tabular-nums; }
.sticky-timer { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
@media (max-width: 860px) { .sticky-timer { top: 84px; } }

/* Drill */
.drill-ans { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
.drill-ans label { display: flex; flex-direction: column; font-size: .8rem; color: var(--muted); gap: 3px; }
.drill-ans input { width: 130px; }
.ok { color: var(--good); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }

/* Theory */
.theory-sec { margin-bottom: 4px; }
.pitfalls li { margin-bottom: 4px; }
.conf { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.conf button { border: 0; background: var(--surface); color: var(--ink); padding: 6px 11px; font: inherit; font-size: .82rem; cursor: pointer; border-right: 1px solid var(--line); }
.conf button:last-child { border-right: 0; }
.conf button.on[data-v="1"] { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.conf button.on[data-v="2"] { background: var(--mid-soft); color: var(--mid); font-weight: 600; }
.conf button.on[data-v="3"] { background: var(--good-soft); color: var(--good); font-weight: 600; }
.topic-list a { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 11px; text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: var(--surface); margin-bottom: 8px; }
.topic-list a:hover { border-color: var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--surface2); border: 1px solid var(--line); }
.dot.c1 { background: var(--bad); border-color: var(--bad); } .dot.c2 { background: var(--mid); border-color: var(--mid); } .dot.c3 { background: var(--good); border-color: var(--good); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: .88rem; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media print {
  .side, .topbar, .noprint, .btn, .chips { display: none !important; }
  .app { display: block; } main { padding: 0; max-width: none; }
  .card, .fcard { box-shadow: none; break-inside: avoid; }
  body { background: #fff; color: #000; font-size: 12px; }
  .fcard.hidden .ftex { filter: none; }
}

</style>

  <div class="app">
    <aside class="side">
      <div class="brand">EC2211 Plugg<small>Intermediate Macroeconomics</small></div>
      <div class="count" id="countdown"></div>
      <nav id="nav"></nav>
      <div class="side-foot"><button class="btn sm themebtn" title="Byt tema">◐ Tema</button><button class="btn sm" onclick="print()">⎙ Skriv ut</button></div>
    </aside>
    <div>
      <header class="topbar">
        <div class="row"><div class="brand">EC2211 Plugg</div><div class="row" style="gap:8px"><span class="pill" id="mcount"></span><button class="btn sm themebtn" title="Byt tema">◐</button></div></div>
        <nav id="mnav"></nav>
      </header>
      <main id="main"></main>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
// Ämnen (topics) – används överallt för filtrering och statistik
const R = String.raw;

const TOPICS = [
  { id: "t1",  ln: "LN1",      name: "Mäta ekonomin",               en: "Measuring the economy" },
  { id: "t2",  ln: "LN2",      name: "Produktion & tillväxtbokföring", en: "Production & growth accounting" },
  { id: "t3",  ln: "LN2–3",    name: "Solowmodellen",               en: "The Solow model" },
  { id: "t4",  ln: "LN4",      name: "Malthus, Romer & institutioner", en: "Ideas, institutions & growth" },
  { id: "t5",  ln: "LN5a",     name: "Arbetsutbud & arbetslöshet",  en: "Labor supply & unemployment" },
  { id: "t6",  ln: "LN5b",     name: "Konsumtion & investering",    en: "Consumption & investment" },
  { id: "t7",  ln: "LN6",      name: "IS–MP–PC",                    en: "The short run: IS–MP–PC" },
  { id: "t8",  ln: "LN7",      name: "AS–AD, Taylor & tidsinkonsistens", en: "AS–AD, Taylor rule, time inconsistency" },
  { id: "t9",  ln: "LN8",      name: "Penningpolitik i praktiken",  en: "Monetary policy in practice" },
  { id: "t10", ln: "LN9",      name: "Finanspolitik & statsskuld",  en: "Fiscal policy & government debt" },
  { id: "t11", ln: "LN10",     name: "Växelkurser & öppen ekonomi", en: "Exchange rates & international finance" },
  { id: "t12", ln: "LN11a–b",  name: "Betalningsbalans & dollarn",  en: "Balance of payments & int. monetary system" },
];

const topicName = id => (TOPICS.find(t => t.id === id) || {}).name || id;

// Tentaarkiv – vilka ämnen som dykt upp på vilken tenta (Flodén = årets examinator)
const EXAMS = [
  { id: "241029", label: "Okt 2024", examiner: "Flodén",     type: "Ordinarie" },
  { id: "241206", label: "Dec 2024", examiner: "Flodén",     type: "Omtenta" },
  { id: "250319", label: "Mar 2025", examiner: "Sigurdsson", type: "Ordinarie" },
  { id: "250509", label: "Maj 2025", examiner: "Sigurdsson", type: "Omtenta" },
  { id: "251030", label: "Okt 2025", examiner: "Flodén",     type: "Ordinarie" },
  { id: "251204", label: "Dec 2025", examiner: "Flodén",     type: "Omtenta" },
  { id: "260320", label: "Mar 2026", examiner: "Sigurdsson", type: "Ordinarie" },
  { id: "260508", label: "Maj 2026", examiner: "Sigurdsson", type: "Omtenta" },
];

t3: {
  oneLiner: R`Kapitalackumulation ger nivåeffekter och övergångstillväxt – bara TFP-tillväxt ger varaktig tillväxt i BNP per arbetare.`,
  sections: [

      $$k^* = \left(\frac{sA}{\delta}\right)^{\frac{1}{1-\alpha}}, \qquad y^* = A^{\frac{1}{1-\alpha}}\left(\frac{s}{\delta}\right)^{\frac{\alpha}{1-\alpha}}$$
      <p>Om $sy>\delta k$ växer $k$; om $sy<\delta k$ krymper $k$. Varför tar tillväxten slut? <b>Avtagande MPK</b>: investeringen växer mindre än proportionellt medan deprecieringen är proportionell.</p>`},
    { h: "Med befolkningstillväxt $n$ (tentans standardversion!)", body: R`

    { h: "Teknisk utveckling och balanced growth path", body: R`
      <p>Med $A_{t+1}=(1+g_A)A_t$: på en BGP växer $Y$ och $K$ i samma takt $\gamma$ (eftersom $g_K = sY/K - \delta$ kräver konstant $Y/K$):</p>

t4: {
  oneLiner: R`Malthus: teknik → fler människor, inte rikare. Romer: icke-rivala idéer → varaktig tillväxt $g_y = \gamma n$. Institutioner är den fundamentala orsaken.`,

    { h: "Romermodellen", body: R`
      <p><b>Objects are rival, ideas are non-rival</b> (men kan vara delvis <i>excludable</i> via patent, sekretess). Icke-rivalitet ⇒ increasing returns ⇒ perfekt konkurrens räcker inte för att betala för idéer; tillfällig marknadsmakt behövs.</p>
      $$Y_t = A_t^\gamma L_{yt},\quad \Delta A_{t+1} = \zeta L_{at},\quad L_{at}=\lambda L_t,\quad y_t = A_t^\gamma(1-\lambda)$$

      <tr><td>Solow</td><td>Högre $n$ kräver mer investering för att utrusta nya arbetare ⇒ lägre $y^*$.</td></tr>
      <tr><td>Romer</td><td>Fler människor ⇒ fler forskare ⇒ snabbare idétillväxt ⇒ $g_y = \gamma n$.</td></tr></table>`},

      <ul>
        <li>Kapital, humankapital och idéer är <b>proximate causes</b>; institutioner är <b>fundamental causes</b> (North & Thomas: "they are growth").</li>

        <li>Ineffektiva institutioner består eftersom eliter vinner på dem och löften om reformer inte är <b>trovärdiga</b> (commitment problem). Glorious Revolution 1688 i England begränsade kungamakten ⇒ trovärdigt skydd för äganderätt ⇒ en förklaring till att industriella revolutionen började i England.</li>
        <li><b>Aghion–Howitt (Nobel 2025)</b>: <i>creative destruction</i> – nya teknologier ersätter gamla; innovatören får tillfällig monopolvinst tills nästa ersätter den. Effekter: kunskapsspillovers, business stealing, entrenched incumbents. Starkare patent/mindre konkurrens är <b>inte nödvändigtvis</b> bättre.</li>
        <li>Jones (2023): av USA:s ~2 % tillväxt förklaras ~1,7 pe av begränsade faktorer (utbildning, sysselsättning, FoU-andel, talangallokering), bara ~0,3 av befolkningstillväxt. AI i idéproduktion = högre $\zeta$ ⇒ nivåeffekt, inte varaktig tillväxt om inte forskningsproduktiviteten fortsätter öka.</li>

t5: {
  oneLiner: R`Inkomst- vs substitutionseffekt avgör arbetsutbudet; arbetslöshet i steady state $u^* = s/(s+f)$.`,
  sections: [
    { h: "Definitioner (LFS)", body: R`
      <p>$N = E + U + O$. <b>Employment rate</b> $E/N$, <b>participation rate</b> $(E+U)/N$, <b>unemployment rate</b> $U/(E+U)$. Ange alltid åldersintervall! Ungdomsarbetslöshet ≠ andel unga som är arbetslösa (studenter som söker jobb räknas). <b>NEET</b> = varken arbete eller studier – ett annat mått.</p>
      <p>"100 000 fler arbetslösa" och "110 000 fler sysselsatta" kan båda vara sanna om arbetskraften växer.</p>`},
    { h: "Arbetsutbudsmodellen", body: R`
      <p>$\max U(C)-V(H)$ s.t. $C = wH + T$ ⇒ FOC $wU'(C) = V'(H)$ (nytta av en timme till = kostnad).</p>
      <ul>
        <li>$\alpha\ln C + (1-\alpha)\ln(1-H)$, $C=wH$ ⇒ $H=\alpha$, $C=\alpha w$: <b>inkomst- och substitutionseffekten tar ut varandra</b>.</li>
        <li><b>Substitution effect</b>: fritid dyrare ⇒ jobba mer. <b>Income effect</b>: rikare ⇒ mer fritid.</li>
        <li>Tillfällig löneökning: främst substitution (jobba när det lönar sig). Permanent: även inkomsteffekt.</li>
        <li><b>Keynes (1930)</b> 15-timmarsvecka förutsatte att <i>inkomsteffekten dominerar</i>. Stabila timmar i USA trots stigande löner ⇒ effekterna ungefär lika stora. Långsiktigt fallande timmar ⇒ inkomsteffekten något större.</li>
        <li><b>Skatt</b>: utan återföring ($T=0$) tar effekterna ut varandra (log). Med <b>lump-sum transfer</b> $T=\tau w\bar H$ dominerar substitutionseffekten ⇒ $h = \frac{\alpha(1-\tau)}{1-\alpha\tau}$ faller. <b>Prescott (2004)</b>: skatter förklarar varför européer jobbar mindre – hur intäkterna används är avgörande.</li>
      </ul>`},
    { h: "Arbetslöshet: bathtub-modellen", body: R`
      $$U_{t+1}-U_t = sE_t - fU_t \;\Rightarrow\; u^* = \frac{s}{s+f}$$
      <p>Utvidgad med de utanför arbetskraften $D$ (avskräckta $d$, aktivering $a$): $sE=fU$, $dU = aD$ ⇒ $E/N = \frac{af}{a(s+f)+sd}$, men $u^*=s/(s+f)$ påverkas inte av $a,d$. Med en grupp som alltid är sysselsatt (heterogenitet) kan aktiveringspolitik höja <b>både</b> sysselsättningsgrad och arbetslöshet (Problem Set 3).</p>
      <p>Typer: <b>frictional</b> (sök), <b>structural</b> (mismatch, institutioner), <b>cyclical</b> (konjunktur); naturlig arbetslöshet = utan boom/recession. Lönestelhet + minskad efterfrågan ⇒ arbetslöshet.</p>`},
  ],
  pitfalls: [ R`Påstå att sysselsättning och arbetslöshet alltid rör sig i motsatt riktning.`, R`Glöm inte att skriva ut budgetrestriktionen innan du optimerar.` ],
},

t6: {
  oneLiner: R`Euler-ekvationen och permanenta inkomsthypotesen; investera tills MPK = user cost $r+\delta$.`,
  sections: [
    { h: "Tvåperiodsmodellen", body: R`
      <p>$c_1 = y_1 - s$, $c_2 = y_2 + (1+r)s$ ⇒ <b>intertemporal budget constraint</b>: $c_1 + \frac{c_2}{1+r} = y_1 + \frac{y_2}{1+r}$.</p>
      <p>$\max u(c_1)+\beta u(c_2)$ ⇒ <b>Euler equation</b> $u'(c_1) = \beta(1+r)u'(c_2)$. Tolkning: marginalnyttan av att konsumera en enhet idag = att spara den och konsumera $1+r$ enheter imorgon (diskonterat).</p>
      <ul>
        <li>Log: $c_2 = \beta(1+r)c_1$, $c_1 = \frac{1}{1+\beta}\left(y_1+\frac{y_2}{1+r}\right)$.</li>
        <li>CRRA $u=\frac{c^{1-\sigma}-1}{1-\sigma}$: $u' = c^{-\sigma}>0$, $u''=-\sigma c^{-\sigma-1}<0$ ⇒ $c_2/c_1 = [\beta(1+r)]^{1/\sigma}$.</li>
        <li>Diminishing marginal utility ⇒ <b>consumption smoothing</b>.</li>
      </ul>`},
    { h: "Permanent Income Hypothesis (Friedman)", body: R`
      <p>Konsumtionen beror på förväntad livsinkomst, inte bara nuvarande. Tillfällig inkomstökning: $\Delta c_1 = \frac{1}{1+\beta}\Delta y < \Delta y$ (resten sparas). Permanent (med $\beta(1+r)=1$): $\Delta c_1 = \Delta y$.</p>
      <p><b>Antaganden</b>: framåtblickande, rationella förväntningar, kan låna och spara fritt till samma ränta, ingen skuld/tillgång kvar i slutet. Bryts av <b>borrowing constraints</b>, liten likvid förmögenhet ⇒ hög <b>MPC</b>.</p>
      <p>Räntehöjning: substitutionseffekt (konsumera mindre idag), inkomsteffekt (sparare rikare, låntagare fattigare). Svenska hushåll: stora balansräkningar, rörliga räntor ⇒ stark kassaflödeskanal.</p>`},
    { h: "Investering", body: R`
      <p>Köp en enhet kapital: avkastning $MPK + 1-\delta$; jämför med $1+r$ ⇒ <b>user cost of capital</b>:</p>
      $$MPK = r + \delta \quad\left(- \frac{\Delta p^K}{p^K}\text{ om kapitalvinster}\right)$$
      <p>Om MPK > user cost: investera mer. Investeringar ökar med lägre ränta, högre förväntad efterfrågan/produktivitet, billigare kapitalvaror, bättre skatteregler. <b>Tobin's q</b> = marknadsvärde / återanskaffningskostnad; $q>1$ ⇒ investera. Investeringar är mycket <b>mer volatila</b> än konsumtion (lagerstorhet – liten ändring i önskad K ger stor ändring i I).</p>
      <p>Realräntan kopplar hushållens och företagens beslut ⇒ länken till aggregerad efterfrågan och penningpolitik.</p>`},
  ],
  pitfalls: [ R`Euler-ekvationen: glöm inte $\beta$ och $(1+r)$ på rätt sida.`, R`$c_1 = c_2$ gäller bara när $\beta(1+r)=1$.` ],
},

t7: {
  oneLiner: R`IS: hög realränta ⇒ lägre investering ⇒ negativt output gap. MP sätter $r$. PC: positivt gap ⇒ inflation över förväntan.`,
  sections: [
    { h: "Output gap och inflation", body: R`
      <p>$\tilde Y = (Y-\bar Y)/\bar Y$. Sticky prices ⇒ företag möter efterfrågan genom att ändra produktion. Sveriges inflationsmål: <b>2 % KPIF</b> (KPI med fast ränta – tar bort direkt effekt av bolåneräntor).</p>`},
    { h: "IS-kurvan", body: R`
      <p>Antag $C/\bar Y=\alpha_C$, $G/\bar Y=\alpha_G$ osv, och $I/\bar Y = \alpha_I - \beta(r-\bar r)$ ⇒</p>
      $$\tilde Y = \alpha - \beta(r-\bar r),\qquad \alpha \equiv \alpha_C+\alpha_I+\alpha_G+\alpha_{EX}-\alpha_{IM}-1$$
      <p><b>Rörelse längs IS</b> = ändrad $r$. <b>Skift</b> = ändrad efterfrågan vid given $r$ (optimism, G, export upp, import ned).</p>`},
    { h: "MP och Phillipskurvan", body: R`
      <p><b>Fisher equation</b>: $r_t \approx i_t - \pi_t^e$. Med given $\pi^e$ styr centralbanken realräntan ⇒ MP är en horisontell linje vid $r^{MP}$.</p>
      $$\pi_t = \pi_t^e + \kappa\tilde Y_t + \sigma_t,\qquad \text{adaptive: } \pi_t - \pi_{t-1} = \kappa \tilde Y_t + \sigma_t$$
      <p>Positivt gap ⇒ inflationen stiger. Kostnadschock $\sigma>0$ ⇒ inflation upp även vid negativt gap.</p>`},
    { h: "Chocker", body: R`
      <ul>
        <li><b>Efterfrågechock</b> (α↑): IS skiftar höger; om $r$ oförändrad ⇒ $\tilde Y>0$ ⇒ $\pi>\pi^e$. Penningpolitiken kan höja $r$ och stabilisera både gap och inflation – <i>ingen konflikt</i>.</li>
        <li><b>Kostnadschock</b> (σ↑, t.ex. energi): PC skiftar upp. Att höja $r$ sänker inflationen men ger negativt gap ⇒ <b>policy dilemma / trade-off</b>.</li>
        <li><b>ZLB</b>: med $i=0$ blir $r = -\pi$ (MP<sub>ZLB</sub>). Fallande inflation ⇒ <i>stigande</i> realränta ⇒ IS-rörelse mot djupare recession ⇒ deflationsspiral. Finanspolitik (G↑) skiftar IS höger; höjer inflation ⇒ sänker realräntan ⇒ extra stark effekt.</li>
      </ul>`},
  ],
  pitfalls: [ R`Rita alltid IS–MP och PC <b>ovanför varandra</b> med samma x-axel ($\tilde Y$) och märk axlar & kurvor.`, R`Centralbanken styr nominell ränta – realräntan bara givet förväntningar.` ],
},

t8: {
  oneLiner: R`AD = IS + penningpolitisk regel. AS = Phillipskurvan. Taylorprincipen. Diskretion ⇒ inflation bias utan produktionsvinst.`,
  sections: [
    { h: "AD och AS", body: R`
      <p>Regel $r_t-\bar r = \mu(\pi_t - \pi^*)$ i IS ⇒ <b>AD</b>: $\tilde Y_t = \alpha_t - \beta\mu(\pi_t-\pi^*)$ (nedåtlutande i $(\tilde Y,\pi)$: högre inflation ⇒ högre ränta ⇒ lägre efterfrågan). Större $\mu$ ⇒ flackare AD.</p>
      <p><b>AS</b>: $\pi_t = \pi_{t-1} + \kappa\tilde Y_t + \sigma_t$ (uppåtlutande; skiftar med förväntningar och kostnadschocker).</p>
      <p><b>Antaganden att nämna på tentan</b>: sticky prices på kort sikt, potentiell produktion exogen, IS från investeringars räntekänslighet, centralbanken följer regeln och styr realräntan (Fisher), adaptiva förväntningar $\pi^e_t=\pi_{t-1}$, $\kappa>0$.</p>`},
    { h: "Dynamik – standardscenarier", body: R`
      <ul>
        <li><b>Tillfällig kostnadschock</b>: AS upp ⇒ $\pi\uparrow$, $\tilde Y<0$. Nästa period: chocken borta men $\pi^e = \pi_1$ högt ⇒ AS kvar ovanför ⇒ negativt gap pressar ned inflationen gradvis; AS skiftar ned period för period, ekonomin glider längs AD tillbaka.</li>
        <li><b>Sänkt inflationsmål</b> (adaptiva förväntningar): AD skiftar ned/vänster (vid varje $\pi$ vill CB ha högre ränta). Period 1: $\pi^e = \pi^*_{gammal}$ ⇒ recession, inflationen faller något. Gradvis skiftar AS ned tills $\pi = \bar\pi$, $\tilde Y=0$. Kostsam <b>disinflation</b> (USA/Sverige 1980-tal).</li>
        <li><b>Trovärdigt mål</b> ($\pi^e_t = \alpha\pi^*+(1-\alpha)\pi_{t-1}$): AS skiftar ned direkt ⇒ mindre recession, snabbare övergång. Fullt trovärdigt ⇒ ingen produktionskostnad.</li>
        <li><b>Höjt inflationsmål</b>: AD skiftar upp ⇒ boom ($\tilde Y>0$), inflationen stiger gradvis mot nya målet; med kommunikation kan förväntningarna hoppa direkt och övergången ske utan boom.</li>
        <li><b>Permanent ökad penningmängdstillväxt för att hålla $\tilde Y>0$</b>: fungerar bara tillfälligt – förväntningarna kommer ikapp; långsiktigt $\tilde Y=0$ och högre inflation (vertikal långsiktig PC).</li>
      </ul>`},
    { h: "Taylorregeln och Taylorprincipen", body: R`
      $$i_t = \pi_t + \bar r + \mu(\pi_t-\pi^*) + \omega\tilde Y_t,\qquad \mu=\omega=0.5 \text{ (Taylor 1993)}$$
      <p><b>Taylor principle</b>: nominell ränta ska höjas <i>mer än ett-till-ett</i> med inflationen så att realräntan $r = i - \pi^e$ stiger. Annars sänker högre inflation realräntan ⇒ stimulerar efterfrågan ⇒ ännu högre inflation (instabilitet; 1970-talet). Regeln är ett <b>benchmark</b>, inte mekanisk: gapet, $\bar r$ mäts osäkert; källan till inflationen spelar roll.</p>`},
    { h: "Tidsinkonsistens (Kydland–Prescott, Barro–Gordon)", body: R`
      <p>Policymakern vill ha output över potential. Efter att förväntningar satts frestas den att skapa överraskningsinflation. Privata aktörer förutser det ⇒ i jämvikt $\pi=\pi^e$, $\tilde Y=0$ men <b>inflation bias</b>.</p>
      <ul>
        <li>$L = (\pi-\pi^*)^2+\lambda(\tilde Y - Y^*)^2$, $\pi = \pi^e + \kappa\tilde Y$ ⇒ $\pi = \pi^* + \frac{\lambda}{\kappa}Y^*$.</li>
        <li>Tentavariant: $L = \pi^2 - \lambda y$, $y = \bar y + \kappa(\pi-\pi^e)$ ⇒ FOC $2\pi - \lambda\kappa = 0$ ⇒ $\pi = \pi^e = \lambda\kappa/2$, $y = \bar y$. Större $\lambda$ ⇒ större frestelse ⇒ högre inflation.</li>
        <li>Lösning: <b>oberoende centralbank</b> med tydligt mål, kommittébeslut, överlappande mandat, transparens, ansvarsutkrävande (delegation, "konservativ centralbankschef").</li>
      </ul>`},
  ],
  pitfalls: [ R`Glöm inte att AD skiftar när målet $\pi^*$ ändras – det är regeln som ändras.`, R`Visa period 1 och period 2 separat; i period 2 är $\pi^e_2=\pi_1$.`, R`Kostnadschock: rörelse <i>längs</i> AD (regeln är redan inbyggd), inte skift i AD.` ],
},

t9: {
  oneLiner: R`Transmission via räntor, krediter, kassaflöden, växelkurs och förväntningar. Riskpremier, bankkriser, QE, pengar och oberoende.`,
  sections: [
    { h: "Tolka chocker i realtid", body: R`<p>Efterfrågeinflation (positivt gap) vs kostnadsinflation (svagt gap) kräver olika svar. Post-pandemi: utbudsstörningar + finans- och penningpolitiskt stöd + efterfrågeskift varor/tjänster + energi efter Ukraina + strama arbetsmarknader. Realtidsskattningar av gapet är osäkra och revideras – 1970-talets <b>Great Inflation</b> delvis p.g.a. överskattad potential (produktivitetsavmattning) och för passiv politik (bröt Taylorprincipen).</p>`},
    { h: "Transmissionsmekanismen", body: R`
      <ol>
        <li>CB höjer $i$ ⇒ realräntan stiger (givet $\pi^e$).</li>
        <li>Marknads- och utlåningsräntor stiger (förväntade framtida korträntor + term- och riskpremier).</li>
        <li>Räntekänslig konsumtion och investering faller (även via kassaflöde – rörliga bolån i Sverige).</li>
        <li>Output gap faller längs IS ⇒ inflationstrycket minskar via PC – med <b>fördröjning</b> ⇒ politiken måste vara framåtblickande.</li>
      </ol>
      <p>Korrelation ≠ kausalitet: CB höjer när inflationen är hög ⇒ räntan korrelerar positivt med inflation. Identifiera <b>monetary policy surprises</b>.</p>`},
    { h: "Banker, riskpremier och kriser", body: R`
      <p>Låneräntan $r^b = r + \rho$ ⇒ IS: $\tilde Y = \alpha - \beta(r+\rho-\bar r)$. Finansiell stress höjer $\rho$ och minskar efterfrågan även utan räntehöjning (GFC 2008). Banker är sköra: långa illikvida lån finansierade med inlåning, lite eget kapital ⇒ likviditets- och solvensproblem förstärker varandra (SVB 2023). <b>Great Depression</b>: penningåtstramning, krasch, bankruns (Bernanke), kollaps i penningmängd (Friedman–Schwartz), deflation höjer realränta och realskuld, guldmyntfoten.</p>`},
    { h: "QE och centralbankens balansräkning", body: R`<p>Köp av långa värdepapper betalda med reserver. Kanaler: lägre långräntor/termpremier, portföljomviktning, marknadsfunktion, signal om låga räntor länge. Relevant vid <b>effective lower bound</b>. Problem: osäkra effekter, ränterisk/förluster för CB, fördelning av risk, suddar ut gränsen mot finanspolitik. Andra verktyg vid ZLB: <b>forward guidance</b>, negativa räntor, utlåning till banker, finanspolitik.</p>`},
    { h: "Pengar", body: R`<p>Funktioner: <b>medium of exchange, unit of account, store of value</b>. Commodity vs fiat. De flesta pengar skapas av <b>affärsbanker</b> när de lånar ut (lån = tillgång, inlåning = skuld). Begränsas av efterfrågan på lån, bankernas vilja och regler. Centralbanken står för avvecklingstillgången (RIX). Bitcoin: volatil, ingen utgivare; stablecoins: värdet beror på reserver och inlösen – sårbara för runs. Kvantitetsteorin $MV=PY$: på kort sikt (stela priser) ökar $M$ produktionen; på lång sikt bara priserna (<b>neutralitet</b>).</p>`},
    { h: "Förväntningar, oberoende och kommunikation", body: R`<p>Inflationsmål = nominellt ankare; trovärdighet påverkar AS-kurvans läge. Oberoende gäller <b>instrumentvalet</b>, målet sätts politiskt; kräver ansvarsutkrävande. <b>Flexibel inflationsmålspolitik</b>: tillfälliga avvikelser OK. Kommunikation är ett verktyg men "mer" är inte automatiskt bättre (Warsh: tystare Fed).</p>`},
  ],
  pitfalls: [ R`Riskpremien är en <b>skift</b>faktor i IS – inte samma sak som en högre styrränta.` ],
},

t10: {
  oneLiner: R`Multiplikatorn $1/(1-MPC)$, automatiska stabilisatorer, Ricardiansk ekvivalens och skulddynamik $\Delta b \approx (i-g)b - s^P$.`,
  sections: [
    { h: "Keynesian cross och multiplikatorer", body: R`
      <p>$E = C + I^p + G$, $C = \bar C + MPC[(Y-T)-(\bar Y-\bar T)]$. Jämvikt $Y=E$. Ofrivilliga lagerförändringar driver justeringen.</p>
      $$\Delta Y = \frac{1}{1-MPC}(\Delta I + \Delta G - MPC\cdot\Delta T)$$
      <p>$\Delta Y/\Delta G = 1/(1-MPC) > 1$; skattemultiplikator $-MPC/(1-MPC)$ är mindre i absolutbelopp. MPC = 0,4, ΔG = 20 ⇒ ΔY ≈ 33. I LN6:s IS-kurva är konsumtionen fast ⇒ multiplikator 1.</p>
      <p><b>Större multiplikator</b> när: mycket slack, penningpolitiken ackommoderar eller är vid <b>ZLB</b>, inhemska varor, mottagare med hög MPC. <b>Mindre</b> när: nära kapacitet, CB motverkar (<b>crowding out</b>: högre $r$ trycker ut privat I och C), hög importbenägenhet ($\tilde Y = \frac{\alpha-\beta(r-\bar r)}{1+\eta}$), Ricardianska hushåll, stigande riskpremier.</p>`},
    { h: "Automatiska stabilisatorer vs diskretionär politik", body: R`<p><b>Automatiska</b>: progressiv inkomstskatt, a-kassa, socialbidrag – ändras utan nytt beslut, snabba och förutsägbara. <b>Diskretionära</b>: aktiva beslut – infrastrukturinvesteringar, skatterabatter, tillfälliga transfereringar, investeringsavdrag. Problem: beslutstid, implementering, svår att avveckla, osäkert gap. Pandemin: i USA steg disponibel inkomst medan produktionen kollapsade ⇒ bidrog till inflation.</p>`},
    { h: "Ricardiansk ekvivalens", body: R`
      <p>Statens IBC: $T_1 + \frac{T_2}{1+i} = G_1 + \frac{G_2}{1+i} + (1+i)B_1$. Insatt i hushållens IBC ⇒ livsresurser $= PV(Y) - PV(G)$: <b>tidpunkten för klumpsummeskatter spelar ingen roll</b>. En lånefinansierad skattesänkning sparas helt (för att betala framtida skatt).</p>
      <p><b>Håller troligen inte fullt ut</b>: likviditetsbegränsade hushåll (hög MPC), kortsiktighet/myopi, skatter på framtida generationer som inte bryr sig, distortionära skatter, osäkerhet. Ändringar i <b>G</b> påverkar ändå efterfrågan (tillfällig G-ökning ⇒ efterfrågan upp).</p>`},
    { h: "Skulddynamik", body: R`
      $$B_{t+1} = (1+i)B_t - S^P_t,\qquad b_{t+1}-b_t \approx (i-g)b_t - s^P_t,\qquad \text{stabil: } s^P = (i-g)b$$
      <ul>
        <li>Exempel: $b=100\%$, $i=5\%$, $g=3\%$ ⇒ $s^P=2\%$ av BNP.</li>
        <li>Totalt saldo: $B_{t+1}-B_t = -S_t$; stabil kvot kräver $s = -gb$ ⇒ man <b>kan</b> ha permanent totalt underskott. Om $i>g$ krävs dock primärt <b>överskott</b>.</li>
        <li>$i<g$ gör det inte gratis: räntor kan stiga, marginalräntan stiger med skulden, refinansieringsrisk, crowding out.</li>
        <li><b>Doom loop</b>: högre räntor ⇒ större krav på överskott ⇒ åtstramning sänker tillväxt ⇒ högre riskpremie.</li>
        <li>Marknadsränta ≠ genomsnittlig ränta på skuldstocken (löptider!).</li>
      </ul>`},
    { h: "Skuld, inflation och finanspolitisk dominans", body: R`<p>Sargent: "inflation is always and everywhere a fiscal phenomenon". Om överskott inte kan stabilisera skulden: default, åtstramning, <b>financial repression</b>, penningfinansiering, eller att <b>prisnivån stiger</b> och urholkar realvärdet av nominell skuld. <b>Fiscal dominance</b> = penningpolitiken underordnas statens finansieringsbehov. Treasury–Fed Accord 1951. EU förbjuder direkt penningfinansiering men QE i andrahandsmarknaden suddar gränsen.</p>`},
    { h: "Svenska finanspolitiska ramverket", body: R`<p>Saldomål (1/3 % överskott t.o.m. 2026, <b>balans</b> över konjunkturcykeln från 2027), <b>skuldankare 35 %</b> av BNP (Maastrichtskuld), utgiftstak, kommunalt balanskrav, top-down-budgetprocess, Finanspolitiska rådet. Regler ska begränsa underskottsbias men låta automatiska stabilisatorer verka.</p>`},
  ],
  pitfalls: [ R`Blanda inte ihop primärt saldo (exkl. räntor) och totalt saldo.`, R`Ricardiansk ekvivalens handlar om <b>finansieringen</b> (timing av skatter), inte om G.` ],
},

t11: {
  oneLiner: R`$Q = EP/P^w$, PPP på lång sikt, UIP på kort sikt; öppen IS-kurva och trilemmat.`,
  sections: [
    { h: "Nominell och real växelkurs", body: R`<p>Jones konvention: $E$ = utländsk valuta per enhet inhemsk (EUR/SEK). $E\uparrow$ = <b>appreciering</b>. OBS: marknadsnotering EURSEK är det omvända (SEK per EUR). Real växelkurs $Q = E\,P/P^w$; $Q\uparrow$ = real appreciering (inhemska varor dyrare). Med stela priser följer $Q$ $E$ på kort sikt.</p>`},
    { h: "PPP och Balassa–Samuelson", body: R`
      <p>Law of one price ⇒ <b>absolut PPP</b> $Q=1$; <b>relativ PPP</b> $\Delta\ln E \approx \pi^w - \pi$. Fungerar dåligt på kort sikt: transportkostnader, handelshinder, olika korgar, prisdiskriminering, <b>icke-handlade varor</b>. Big Mac (mycket lokal arbetskraft) vs iPhone (handlas lätt) – mindre prisskillnader för iPhone.</p>
      <p><b>Balassa–Samuelson</b>: rika länder har högre produktivitet i handelssektorn ⇒ högre löner där (LOOP) ⇒ arbetsmobilitet höjer lönerna även i tjänstesektorn ⇒ <b>icke-handlade varor dyrare</b> ⇒ högre prisnivå i rika länder. Catch-up ⇒ real appreciering (via inflation om fast växelkurs, t.ex. Baltikum).</p>`},
    { h: "Uncovered interest parity", body: R`
      $$1+i_t = (1+i^w_t)\frac{E_t}{E^e_{t+1}} \quad\Leftrightarrow\quad e_t \approx i_t - i^w_t + e^e_{t+1}$$
      <p>Givet förväntad framtida växelkurs: högre inhemsk ränta ⇒ <b>omedelbar appreciering</b>. Samtidigt: om räntan är högre hemma måste valutan förväntas <b>depreciera</b> framöver (annars skulle alla placera här). Neverland 4 % vs Wonderland 2 %: Neverlands valuta förväntas depreciera ~2 %/år.</p>`},
    { h: "Öppen IS och penningpolitik", body: R`
      <p>$NX/\bar Y = \alpha_{NX} - \beta_{NX}(r-r^w)$ ⇒ $\tilde Y = \alpha - \beta(r-\bar r)$ med $\beta = \beta_I+\beta_{NX}$ och $\alpha$ inkluderar $\beta_{NX}(r^w-\bar r)$. Två kanaler: <b>räntekanalen</b> ($I\downarrow$) och <b>växelkurskanalen</b> ($E\uparrow \Rightarrow Q\uparrow \Rightarrow NX\downarrow$).</p>
      <ul>
        <li><b>Utländsk åtstramning</b>: $i^w\uparrow$ ⇒ hemvalutan deprecierar ⇒ $NX\uparrow$ ⇒ IS skiftar höger (positiv efterfrågechock hemma). För att stabilisera ska hemma-CB höja <b>mindre</b> än $\Delta i^w$.</li>
        <li><b>Utländsk räntesänkning</b> (t.ex. ECB sänker): hemvalutan apprecierar ⇒ NX ned ⇒ AD skiftar vänster ⇒ negativt gap, lägre inflation; CB sänker räntan längs regeln; när utländska räntan normaliseras går det tillbaka. Även direkt pass-through: billigare import ⇒ lägre inflation (som negativ kostnadschock). En utländsk recession minskar dessutom exportefterfrågan.</li>
        <li>Depreciering kan höja inflationen direkt via importpriser – behandla som kostnadschock $\sigma>0$.</li>
      </ul>`},

t12: {
  oneLiner: R`$CA = FA = S - I$; NIIP-dynamik liknar statsskuld; dollarns dominans, Triffin, exorbitant privilege och tullar.`,
  sections: [
    { h: "Betalningsbalansen", body: R`
      <p>$CA = NX + NFI + TR$ (handelsbalans + primärinkomster + sekundärinkomster). <b>Financial account</b> $FA$ = residenters nettoköp av utländska tillgångar − utlänningars nettoköp av inhemska. Ignorera capital account ⇒ $CA = FA$.</p>
      $$Y = C+I+G+NX \;\Rightarrow\; NX = \underbrace{(Y-T-C)}_{\text{private saving}} + \underbrace{(T-G)}_{\text{public saving}} - I = S - I$$
      <p>Sluten ekonomi: $NX=0$ ⇒ $S = I$. Öppen: investering kan finansieras utomlands. <b>USA efter WWII</b>: Europa behövde återuppbygga (I ≫ S), USA hade högt sparande ⇒ USA lånade ut (Marshallplanen, kapitalutflöde $FA>0$) ⇒ $NX>0$. Underskott är inte automatiskt dåligt (kan finansiera produktiva investeringar).</p>`},
    { h: "Nettoinvesteringsposition (NIIP)", body: R`
      <p>$NIIP_{t+1} = NIIP_t + CA_t (+VAL_t)$. Med $NFI = i\cdot NIIP$: $NIIP_{t+1} = (1+i)NIIP_t + NX_t$. Stabil kvot mot BNP:</p>
      $$ca = g\cdot niip,\qquad nx = -(i-g)\,niip$$
      <p>Ex: $i=5\%$, $g=4\%$, $ca=-4\%$ ⇒ $niip=-100\%$, kräver $nx=+1\%$. Värderingseffekter: dollardepreciering förbättrar USA:s NIIP (tillgångar i utländsk valuta, skulder i dollar). USA har negativ NIIP men ofta positiv NFI – avkastningsdifferens ($r^A>r^L$).</p>`},
    { h: "Dollarn och det internationella monetära systemet", body: R`
      <ul>
        <li>Dollarn på ena sidan av 89 % av valutatransaktionerna; ~57 % av reserverna (från 72 % 2001). Orsaker: stor ekonomi, djupa likvida marknader, säkra tillgångar (Treasuries), fri konvertering, rättsstat, <b>nätverkseffekter</b>.</li>
        <li><b>Triffin-dilemmat</b> (Bretton Woods): växande efterfrågan på dollarreserver vs förtroende för guldkonvertering. Moderna versioner: säkra tillgångar kräver utbud av Treasuries; reservefterfrågan ⇒ stark dollar ⇒ CA-underskott (Miran). Men <b>accounting ≠ causality</b>: dollarns dominans kräver inte mekaniskt CA-underskott.</li>
        <li><b>Exorbitant privilege</b>: lägre lånekostnad (convenience yield), avkastningsdifferens, värderingsförsäkring, geoekonomisk makt (sanktioner, swap lines). Kostnad: starkare dollar.</li>
        <li><b>Tullar</b>: $NX = S - I$ ⇒ varaktig förbättring kräver högre sparande eller lägre investering. Om S−I oförändrat apprecierar dollarn och motverkar tullen. USA:s CA-underskott var 3,7 % 2025 trots tullar.</li>
        <li>Plaza Accord 1985 – koordinering kan påverka förväntningar men ersätter inte justering i S och I. <b>Geoeconomics</b>: ekonomiska instrument för strategiska mål.</li>
      </ul>`},
  ],
  pitfalls: [ R`$CA<0$ betyder att utlandet köper netto inhemska tillgångar ($FA<0$), inte att landet "förlorar pengar".` ],
},

{ id:"s1", t:"t3", src:"241029 Q2 · 251030 Q2 · 251204 Q2", pts:8, q:R`(a) Consider the Solow model where population $L_t$ grows at rate $n$, a fraction $s$ of income is invested and capital depreciates at rate $\delta$; $Y_t = AK_t^\alpha L_t^{1-\alpha}$. Derive an expression for $\Delta k_{t+1}$, where $k_t \equiv K_t/L_t$. (b) State the steady-state condition and illustrate the equilibrium in a diagram.`,
  a:R`<p><b>(a)</b> Capital accumulation: $K_{t+1} = (1-\delta)K_t + sY_t$. Divide by $L_t$ and use $\frac{K_{t+1}}{L_t} = \frac{L_{t+1}}{L_t}\frac{K_{t+1}}{L_{t+1}} = (1+n)k_{t+1}$:</p>
  $$(1+n)k_{t+1} = (1-\delta)k_t + sAk_t^\alpha$$
  <p>Subtract $(1+n)k_t$ from both sides and divide by $(1+n)$:</p>
  $$\Delta k_{t+1} = k_{t+1}-k_t = \frac{sAk_t^\alpha - (\delta+n)k_t}{1+n} \approx sAk_t^\alpha-(\delta+n)k_t$$
  <p>where $y_t = Y_t/L_t = Ak_t^\alpha$. Investment per worker $sAk^\alpha$ raises $k$; break-even investment $(\delta+n)k$ is needed to replace worn-out capital ($\delta k$) and equip new workers ($nk$).</p>
  <p><b>(b)</b> Steady state: $\Delta k = 0 \Leftrightarrow sA(k^*)^\alpha = (\delta+n)k^*$, so $k^* = \left(\frac{sA}{\delta+n}\right)^{1/(1-\alpha)}$ and $y^* = A^{1/(1-\alpha)}\left(\frac{s}{\delta+n}\right)^{\alpha/(1-\alpha)}$.</p>
  <p><i>Diagram:</i> $k$ on the horizontal axis; concave curves $y=Ak^\alpha$ and $sy = sAk^\alpha$, a straight line $(\delta+n)k$ through the origin. Steady state where $sy$ crosses the line. To the left of $k^*$: $sy > (\delta+n)k$ ⇒ $k$ rises; to the right: $k$ falls. Gross investment is positive in steady state but net investment (per worker) is zero.</p>`,
  keys:["Startar från K_{t+1} = (1−δ)K_t + sY_t","Använder K_{t+1}/L_t = (1+n)k_{t+1}","Korrekt Δk med (δ+n)","Tolkar break-even (δk + nk)","Steady state-villkor sy* = (δ+n)k*","Diagram med märkta axlar & kurvor, pilar för dynamik"], sim:"solow:base" },

{ id:"s2", t:"t3", src:"241029 Q2d", pts:12, q:R`The economy is in steady state. Analyze the effects of a permanent increase in the saving rate. Show how both output per person and consumption per person develop over time. Explain.`,
  a:R`<p><b>Diagram:</b> The investment curve shifts up from $sAk^\alpha$ to $s'Ak^\alpha$. At the old $k^*$, investment now exceeds break-even investment $(\delta+n)k^*$.</p>
  <p><b>Transition:</b> Since $k$ is predetermined, $k$ and $y$ do not change on impact. Net investment becomes positive, so $k$ starts to rise, and with it $y = Ak^\alpha$. Because of <b>diminishing marginal product of capital</b>, each additional unit of $k$ raises output (and investment) by less while break-even investment rises proportionally ⇒ the growth rate of $y$ jumps up at first and then gradually declines to zero as the economy approaches the new steady state $k^{**}>k^*$, $y^{**}>y^*$.</p>
  <p><b>Long run:</b> $y^* = A^{1/(1-\alpha)}(s/(\delta+n))^{\alpha/(1-\alpha)}$ is higher (level effect), but growth in output per person is again zero (aggregate output grows at $n$). Higher saving gives <b>transitional growth, not sustained growth</b>.</p>
  <p><b>Consumption per person</b> $c=(1-s)y$: on impact $y$ is unchanged but the share consumed falls ⇒ $c$ <b>jumps down</b>. Then $c$ rises with $y$. Long-run effect: $c^* = (1-s)y^*$ is higher if the economy was below the golden-rule saving rate (with Cobb–Douglas, $s_{gold}=\alpha$; for realistic $s<\alpha \approx 1/3$ consumption ends up higher), otherwise lower.</p>
  <p><i>Time-series graphs:</i> (1) $\ln y_t$ flat, then rising concavely to a new higher level; (2) $c_t$ drops at $t_0$, then rises above the old level (if $s<\alpha$); (3) $g_y$ jumps up at $t_0$ and decays to zero.</p>`,
  keys:["Skift i sy-kurvan i diagrammet","k predetermined – ingen hoppeffekt i y","Mekanism: avtagande MPK ⇒ tillväxten avtar","Nivåeffekt men g_y → 0 på lång sikt","c hoppar NED direkt, stiger sedan","Golden rule-villkor för långsiktig c","Tre tidsseriegrafer"], sim:"solow:s_up" },

{ id:"s3", t:"t3", src:"251204 Q2c", pts:17, q:R`The economy starts in steady state. Analyze the effects of an immediate and permanent <b>decrease</b> in the saving rate. Comment on the levels and growth rates of per capita GDP and per capita consumption.`,
  a:R`<p><b>Diagram:</b> $sAk^\alpha$ shifts down to $s'Ak^\alpha$. At the old $k^*$, investment per worker is now below break-even investment $(\delta+n)k^*$ ⇒ net investment negative.</p>
  <p><b>Impact:</b> $k$ is predetermined ⇒ $y = Ak^\alpha$ unchanged at $t_0$. Consumption $c = (1-s')y$ <b>jumps up</b> because a larger share of unchanged output is consumed.</p>
  <p><b>Transition:</b> $k$ falls since investment does not cover depreciation and capital for new workers. As $k$ falls, $y$ falls; growth in $y$ is negative. Because MPK is higher at lower $k$, investment falls less than proportionally while break-even falls proportionally, so the gap shrinks and the negative growth rate approaches zero.</p>
  <p><b>Long run:</b> new steady state with lower $k^*$ and $y^*$ (level effect). Growth in per capita GDP returns to zero (aggregate GDP grows at $n$). Per capita consumption: after the initial jump up it declines with $y$; whether long-run $c^*$ is higher or lower depends on the golden rule: if the original $s$ was below $s_{gold}=\alpha$ (the realistic case), $c^*$ ends up <b>lower</b> than initially; if the economy had over-saved ($s>\alpha$), lower saving raises long-run consumption (dynamic inefficiency).</p>
  <p><i>Graphs:</i> Solow diagram with downward shift; $y_t$ falling to a lower level; $c_t$ jumps up then falls below the initial level; $g_y$ jumps to a negative value then converges to 0.</p>`,
  keys:["sy-kurvan skiftar ned","y oförändrat på impact; c hoppar UPP","k och y faller under övergången, g_y < 0 men → 0","Mekanismen via MPK/avtagande avkastning","Lägre nivå, oförändrad (noll) långsiktig tillväxt per capita","Golden rule-diskussion för c*","Tidsseriegrafer"], sim:"solow:s_down" },

{ id:"s4", t:"t3", src:"251030 Q2c–d", pts:17, q:R`(c) Starting in steady state, analyze an immediate and permanent fall in the population growth rate. What happens to the level and growth rate of per capita GDP? (d) How and why would the conclusions change according to the Romer model? (no equations)`,
  a:R`<p><b>(c)</b> Break-even investment $(\delta+n')k$ becomes <b>flatter</b>. At the old $k^*$, $sy > (\delta+n')k^*$ – fewer resources are needed to equip new workers – so $k$ rises. $y$ is unchanged on impact (and $c=(1-s)y$ too, no jump), then $k$, $y$ and $c$ rise gradually. Per capita growth is temporarily positive and declines to zero due to diminishing MPK. New steady state: $k^* = (sA/(\delta+n'))^{1/(1-\alpha)}$ and $y^*$ are <b>higher</b>. Long-run growth of per capita GDP is still zero (constant A); <b>aggregate</b> GDP growth falls from $n$ to $n'$.</p>
  <p><b>(d)</b> In the Romer model, ideas are <b>non-rival</b>, and new ideas are produced by researchers whose number is proportional to the population. Long-run growth in income per person is $g_y = \gamma n$ – driven by growth in the number of researchers. A lower population growth rate therefore <b>lowers the long-run growth rate</b> of per capita income (after a transition in which $A/L$ adjusts). The Solow model sees people as rival users of capital (more people dilute capital); the Romer model sees people as producers of ideas that benefit everyone. So falling fertility is good for per capita income levels in Solow but bad for long-run growth in Romer.</p>`,
  keys:["Break-even-linjen blir flackare","Ingen hoppeffekt; gradvis ökning i k, y, c","Högre nivå y*, g_y → 0","Aggregerad tillväxt faller till n'","Romer: icke-rivala idéer, fler människor = fler forskare","Romer: g_y = γn faller permanent"], sim:"solow:n_down" },

{ id:"s5", t:"t3", src:"241206 Q2c", pts:11, q:R`The economy is in steady state. Analyze the effects of a permanent decrease in the depreciation rate $\delta$. Show how output per person and consumption per person develop over time.`,
  a:R`<p>The break-even line $(\delta+n)k$ rotates down (flatter). At the old $k^*$, $sy > (\delta'+n)k^*$ so net investment is positive. On impact $k$, $y$ and $c=(1-s)y$ are unchanged (no jump because $s$ is unchanged). Then $k$ rises, $y$ rises and $c$ rises proportionally with $y$; the growth rate of $y$ is positive but falling (diminishing MPK) and converges to zero. New steady state with higher $k^*$, $y^*$ and $c^*$ (consumption is higher at all dates after the shock, since $s$ unchanged). Long-run per capita growth is zero; aggregate output grows at $n$.</p>`,
  keys:["Linjen roterar ned","Ingen hoppeffekt i y eller c","c växer med y (s oförändrat)","Högre steady state-nivåer, noll långsiktig tillväxt"], sim:"solow:d_down" },

{ id:"s6", t:"t3", src:"260320 Q3 · 260508 Q2", pts:20, q:R`(b) Derive the elasticity of $y^*$ with respect to $s$ in the basic Solow model with constant $L$ and $Y = K^\alpha L^{1-\alpha}$; with $\alpha = 1/3$, can increased saving generate permanent growth? (c) In MRW with $\ln y^* = \frac{\alpha}{1-\alpha-\beta}\ln s_k + \dots$, what is the elasticity w.r.t. $s_k$ when $\alpha=\beta=1/3$? (d) With $Y=AK$, show $\gamma = sA-\delta$.`,
  a:R`<p><b>(b)</b> $y^* = (s/\delta)^{\alpha/(1-\alpha)}$ ⇒ $\ln y^* = \frac{\alpha}{1-\alpha}(\ln s - \ln\delta)$ ⇒ elasticity $\frac{\alpha}{1-\alpha} = \frac{1/3}{2/3} = 0.5$. A 10 % increase in $s$ raises $y^*$ by about 5 % – a <b>level</b> effect only. Growth is transitional; diminishing MPK means long-run growth is zero.</p>
  <p><b>(c)</b> Elasticity $\frac{\alpha}{1-\alpha-\beta} = \frac{1/3}{1/3} = 1$ – twice as large. Mechanism: higher $s_k$ raises income, which raises investment in human capital too ($s_H Y$), so the broad capital share is $\alpha+\beta = 2/3$: diminishing returns to accumulable factors set in more slowly, and capital differences translate into larger income differences.</p>
  <p><b>(d)</b> $K_{t+1} = (1-\delta)K_t + sAK_t$ ⇒ $g_K = \frac{K_{t+1}-K_t}{K_t} = sA-\delta$. Since $Y = AK$, $g_Y = g_K = \gamma = sA - \delta$. A permanent rise in $s$ raises the growth rate <b>permanently</b>. The difference: constant (not diminishing) returns to capital ($\alpha=1$) – the marginal product of capital never falls, so accumulation never stops generating growth.</p>`,
  keys:["Elasticitet α/(1−α) = 0,5","Nivå- inte tillväxteffekt","MRW-elasticitet = 1 och tolkning (bred kapitalandel)","AK: γ = sA − δ","Avkastning på kapital är nyckelantagandet"] },

{ id:"s7", t:"t3", src:"PS2 Q1", pts:10, q:R`Technology transfer raises the level of TFP by 20 % once and permanently (constant labor force, initially in steady state). What happens on impact, during the transition and in the long run? Contrast with TFP growing at constant rate $g_A$.`,
  a:R`<p><b>Impact:</b> $k$ is predetermined, but $y = Ak^\alpha$ jumps up by 20 %. The investment curve $sAk^\alpha$ shifts up, so at the old $k^*$ investment exceeds depreciation.</p>
  <p><b>Transition:</b> $k$ rises (capital deepening) and $y$ rises further; growth declines gradually to zero.</p>
  <p><b>Long run:</b> $y^* \propto A^{1/(1-\alpha)}$ ⇒ $y^*$ rises by $1.2^{1.5}-1 \approx 31\%$ (with $\alpha=1/3$): the direct TFP effect plus induced capital accumulation. Growth: zero before, jumps up at the shock, then declines to zero.</p>
  <p><b>Continuous TFP growth:</b> $g_y = g_A/(1-\alpha)$ permanently along a balanced growth path – a level shift only gives transitional growth, while ongoing growth in A gives sustained growth.</p>`,
  keys:["y hoppar 20 % direkt","Kapitalfördjupning efteråt","y* upp med 1,2^{1/(1−α)}","Kontinuerlig tillväxt: g_A/(1−α)"], sim:"solow:A_up" },

{ id:"s8", t:"t3", src:"PS1 Q4", pts:10, q:R`Compare (i) a one-time permanent increase in the <i>level</i> of the labor force from $L$ to $L'$ with (ii) a permanent increase in its <i>growth rate</i> from $n$ to $n'$ in the Solow model.`,
  a:R`<p><b>(i) Level increase:</b> $K_0$ is predetermined, so $k_0 = K_0/L'$ falls and $y_0$ falls (aggregate $Y_0$ rises since more workers). Neither $sAk^\alpha$ nor $\delta k$ shifts. With lower $k$, $sy > \delta k$ ⇒ $k$ rises back to the <b>same</b> $k^*$; per worker growth is positive during the transition. Long run: same $k^*$, $y^*$; aggregate $K$ and $Y$ higher in proportion to $L'/L$.</p>
  <p><b>(ii) Higher growth rate:</b> the break-even line $(\delta+n')k$ becomes steeper. $k$ and $y$ fall gradually to <b>lower</b> $k^*,y^*$; per worker growth negative during transition, zero in the long run; aggregate output grows faster ($n'$ instead of $n$).</p>
  <p><b>Key difference:</b> a level change has only temporary effects on per-worker variables; a growth-rate change permanently lowers per-worker levels and permanently raises aggregate growth.</p>`,
  keys:["K predetermined, k faller i (i)","Inga kurvor skiftar i (i) – samma steady state","(ii) brantare linje, lägre y*","Aggregerad tillväxt n' i (ii)"] },

// ===================== GROWTH ACCOUNTING (t2) =====================
{ id:"g1", t:"t2", src:"251030 Q1a", pts:5, q:R`$Y_t = A_tK_t^\alpha L_t^{1-\alpha}$ with $\alpha=1/3$, $g_Y=1.5\%$, $g_K=3\%$ and constant population. Calculate TFP growth.`,
  a:R`<p>Taking logs and differentiating: $g_Y = g_A + \alpha g_K + (1-\alpha)g_L$. With $g_L=0$:</p>$$g_A = g_Y - \alpha g_K = 1.5 - \tfrac13\cdot 3 = 0.5\%$$<p>TFP growth is a residual: output growth not accounted for by measured input growth.</p>`,
  keys:["Tillväxtbokföringsformeln","α g_K = 1","g_A = 0,5 %"] },
{ id:"g2", t:"t2", src:"251204 Q1a", pts:5, q:R`$Y = AK^\alpha H^\beta L^{1-\alpha-\beta}$, $\alpha=\beta=1/4$, $g_Y=3\%$, $g_K=4\%$, $g_H=1\%$, $g_L=1\%$. Calculate TFP growth.`,
  a:R`$$g_A = g_Y - \alpha g_K - \beta g_H - (1-\alpha-\beta)g_L = 3 - 1 - 0.25 - 0.5 = 1.25\%$$`, keys:["Rätt vikter (1/4, 1/4, 1/2)","g_A = 1,25 %"] },
{ id:"g3", t:"t2", src:"241029 Q5", pts:10, q:R`$Y_t = A_tK_t^\alpha H_t^{1-\alpha}$, $\alpha=1/3$. Per capita: $g_y=2\%$, $g_k=3\%$, $g_h=0.3\%$ ($h$ = hours per capita). (a) Attribute growth in output per capita to TFP, capital per capita and hours per capita. (b) Attribute it instead to TFP, the capital–output ratio and hours per capita.`,
  a:R`<p><b>(a)</b> Per capita: $y = Ak^\alpha h^{1-\alpha}$ ⇒ $g_y = g_A + \alpha g_k + (1-\alpha)g_h$: $2 = g_A + 1 + 0.2$ ⇒ $g_A = 0.8$. Contributions: TFP 0.8, capital 1.0, hours 0.2 percentage points.</p>
  <p><b>(b)</b> Write $k^\alpha = (K/Y)^\alpha y^\alpha$ ⇒ $y^{1-\alpha} = A (K/Y)^\alpha h^{1-\alpha}$ ⇒ $y = A^{\frac{1}{1-\alpha}}(K/Y)^{\frac{\alpha}{1-\alpha}}h$, so $g_y = \frac{g_A}{1-\alpha} + \frac{\alpha}{1-\alpha}g_{K/Y} + g_h$. With $g_{K/Y} = g_k - g_y = 1$: TFP $0.8 \times 1.5 = 1.2$; capital–output ratio $0.5 \times 1 = 0.5$; hours $0.3$. Sum = 2.0. This attributes more to TFP because TFP growth itself induces capital accumulation (as on a BGP, where $K/Y$ is constant).</p>`,
  keys:["(a) g_A = 0,8; bidrag 0,8 / 1,0 / 0,2","(b) omskrivning med K/Y","(b) 1,2 / 0,5 / 0,3","Tolkning: TFP inducerar kapital"] },
{ id:"g4", t:"t2", src:"251204 Q1b · 241206 Q1b", pts:5, q:R`Does $Y = F(K,L) = AK^\alpha + AL^{1-\alpha}$ (0 < α < 1) display constant returns to scale? Explain.`,
  a:R`<p>Scale both inputs by $x>1$: $F(xK,xL) = x^\alpha AK^\alpha + x^{1-\alpha}AL^{1-\alpha}$. Since $\alpha<1$ and $1-\alpha<1$, both $x^\alpha \lt x$ and $x^{1-\alpha} \lt x$, so $F(xK,xL) < xF(K,L)$: <b>decreasing returns to scale</b>, not CRS. (Similarly $K^\alpha + L^\alpha$ gives $F(xK,xL) = x^\alpha F(K,L)$.) Intuition: each input enters additively with diminishing returns, so doubling everything less than doubles output. Contrast Cobb–Douglas $AK^\alpha L^{1-\alpha}$, which is CRS.</p>`, keys:["Definition av CRS","Skalning med x","Visa < xF ⇒ DRS"] },
{ id:"g5", t:"t2", src:"250319 Q1a–b · 260508 Q1a", pts:10, q:R`For $Y=AK^\alpha L^\beta$: (a) what must hold for constant returns to scale? (b) Set up the firm's profit maximization problem and derive MPK and MPL.`,
  a:R`<p><b>(a)</b> $F(xK,xL) = A(xK)^\alpha(xL)^\beta = x^{\alpha+\beta}F(K,L)$. CRS requires $x^{\alpha+\beta}=x$ ⇒ $\alpha+\beta=1$ (IRS if >1, DRS if <1).</p>
  <p><b>(b)</b> $\max_{K,L} AK^\alpha L^\beta - rK - wL$. FOCs: $MPK = \alpha AK^{\alpha-1}L^\beta = \alpha Y/K = r$; $MPL = \beta AK^\alpha L^{\beta-1} = \beta Y/L = w$. Each input is hired until its marginal product equals its price. With $\beta = 1-\alpha$, factor shares are $rK/Y = \alpha$, $wL/Y = 1-\alpha$ and payments exhaust output.</p>`, keys:["α+β=1","FOC MPK = r, MPL = w","Faktorandelar"] },

// ===================== MALTHUS / ROMER / INSTITUTIONS (t4) =====================
{ id:"m1", t:"t4", src:"241206 Q1d · 260320 Q2a", pts:15, q:R`Using the Malthusian model, analyze how wages and population respond in the short and long run to an innovation (e.g. the potato) that permanently raises agricultural productivity $A$.`,
  a:R`<p><b>Model:</b> labor demand $w_t = (1-a)A_t(D/(HN_t))^a$ – wage = MPL, decreasing in population because land $D$ is fixed. Population dynamics $N_{t+1}/N_t = w_t/w^s$: population grows if the wage exceeds subsistence.</p>
  <p><b>Short run:</b> $A\uparrow$ shifts labor demand up. With $N$ given, the wage jumps above $w^s$.</p>
  <p><b>Transition:</b> Since $w > w^s$, population grows. More workers on fixed land ⇒ lower MPL ⇒ wages fall (movement down the new labor-demand curve). In the $(N_t, N_{t+1})$ diagram, $N_{t+1} = \phi A N_t^{1-a}$ shifts up, so the intersection with the 45° line moves out.</p>
  <p><b>Long run:</b> wage back at subsistence $w^s$, population permanently larger: $N^* = (\phi A)^{1/a}$. Technology raises population, not living standards.</p>
  <p><i>Graphs:</i> (1) $w$–$N$: two downward-sloping labor-demand curves, horizontal $w^s$; (2) $N_{t+1}$–$N_t$: concave curve shifting up, 45° line; (3) wage over time: jump up, gradual decline to $w^s$; (4) population over time: gradual rise to a higher level.</p>`,
  keys:["Arbetsefterfrågan = MPL, fast mark","Lön hoppar upp på kort sikt","Befolkningstillväxt när w > w^s","Lång sikt: w = w^s, större N","Fyra grafer märkta"] },
{ id:"m2", t:"t4", src:"250319 Q2a", pts:15, q:R`Use the Malthus model to analyze an epidemic (AIDS / Black Death) that kills many people during one period and then ends.`,
  a:R`<p>The epidemic is a negative shock to population ($\xi<1$ for one period): $N$ falls. $A$ and the labor-demand curve are unchanged, so with fewer workers per unit of land the MPL – the <b>wage – rises</b> above subsistence (movement up the labor-demand curve). In the $(N_t,N_{t+1})$ diagram the curve shifts down for one period. After the epidemic ends, high wages ⇒ population growth ⇒ wages gradually fall back. <b>Long run:</b> same population $N^*$ and same wage $w^s$ as before – no permanent effect. England after the Black Death: real wages rose, then fell back by ~1600 as population recovered.</p>`, keys:["Rörelse längs arbetsefterfrågan","Lön upp kort sikt","Befolkningen återhämtar sig","Ingen permanent effekt"] },
{ id:"m3", t:"t4", src:"260320 Q2b–c", pts:10, q:R`(b) Greenland had a higher subsistence wage than Iceland. Compare steady-state population and wages. (c) A wage–population figure for England shows wages and population both rising after 1800. What does this imply about $A_t$?`,
  a:R`<p><b>(b)</b> In steady state $w = w^s$. Higher $w^s$ in Greenland ⇒ the steady-state wage is higher there, which (moving up the labor-demand curve) requires a <b>smaller population</b>: $N^* = (\phi A)^{1/a}$ with $\phi \propto 1/w^s$. Iceland supports a larger population.</p>
  <p><b>(c)</b> With constant $A$, the economy moves along a downward-sloping labor-demand curve (higher population ⇔ lower wages). Rising wages <i>and</i> rising population mean the labor-demand curve shifted out continually – $A_t$ grew <b>fast and persistently</b>, faster than population growth could erode wage gains: the escape from the Malthusian trap (Industrial Revolution).</p>`, keys:["Steady state w = w^s","Högre w^s ⇒ mindre N*","Efter 1800: A växer snabbt, kurvan skiftar ut"] },
{ id:"m4", t:"t4", src:"PS2 Q2", pts:12, q:R`Romer model: in 2030 research productivity $\zeta$ falls permanently by 10 %. (a) Immediate effect on the level and growth of knowledge? (b) Evolution of $A/L$ and $g_A$? (c)–(d) Path of output per person and long-run growth. (e) What if instead λ rises?`,
  a:R`<p><b>(a)</b> $A_t$ is predetermined – the level is unchanged on impact. $g_{A,t} = \zeta\lambda L_t/A_t$ falls by 10 % immediately.</p>
  <p><b>(b)</b> Since $g_A < n$, knowledge grows slower than population ⇒ $A/L$ falls ⇒ $g_A = \zeta\lambda L/A$ gradually rises back to $n$. Long-run $g_A = n$.</p>
  <p><b>(c)–(d)</b> $y_t = A_t^\gamma(1-\lambda)$: no jump; grows more slowly for a while, then parallel to the old path (in logs) but <b>permanently lower</b>. Long-run $g_y = \gamma n$ – a permanent level effect, temporary growth effect, because new ideas are proportional to researchers while the stock of knowledge grows: a constant growth rate requires researchers and knowledge to grow at the same rate.</p>
  <p><b>(e)</b> Higher λ: immediate cost – fewer goods workers, $y$ jumps down by the fall in $(1-\lambda)$. Dynamic benefit – more researchers raise $g_A$ temporarily. Eventually $y$ overtakes the old path (higher long-run level) but growth returns to $\gamma n$. Not necessarily higher at every date.</p>`, keys:["A predetermined, g_A faller direkt","A/L faller ⇒ g_A återgår till n","Permanent nivåeffekt, tillfällig tillväxteffekt","λ: kortsiktig kostnad, dynamisk vinst"] },
{ id:"m5", t:"t4", src:"241029 Q4 (essä, 20p)", pts:20, q:R`<b>Essay:</b> Consider the Solow model, the Malthusian model and the Romer model. Explain in words the main assumptions, mechanisms and conclusions. Focus on where the models differ and on how population growth relates to income per capita in the three models. (No equations or graphs.)`,
  a:R`<p><b>Structure (aim for ~3 pages):</b></p>
  <p><b>1. Malthus.</b> Assumptions: production uses labor and a fixed factor (land); diminishing marginal product of labor; population growth increases with income (above subsistence). Mechanism: a productivity improvement raises income, population grows, land per person falls and income returns to subsistence. Conclusion: technology raises population, not living standards – explains pre-industrial stagnation (Black Death example). Population growth <i>reduces</i> income per person and is itself driven by income.</p>
  <p><b>2. Solow.</b> Assumptions: reproducible physical capital with diminishing returns, CRS, exogenous saving rate, exogenous population growth and technology. Mechanism: capital accumulation until investment equals break-even investment. Conclusions: higher saving or lower population growth raise the <i>level</i> of income per worker; capital accumulation gives transitional, not sustained, growth; sustained growth requires exogenous TFP growth; conditional convergence. Population growth <i>dilutes</i> capital: higher $n$ ⇒ lower steady-state income per worker, no effect on long-run growth rate.</p>
  <p><b>3. Romer.</b> Assumptions: ideas are non-rival (partially excludable); a share of the population works in research; new ideas are proportional to researchers. Mechanism: the stock of knowledge raises productivity of all workers simultaneously, so it need not be divided among workers; increasing returns; requires some market power to reward innovation. Conclusions: sustained growth endogenously, $g_y$ proportional to population growth; research productivity and research share affect levels. Population growth <i>raises</i> long-run growth because more people means more researchers.</p>
  <p><b>4. Comparison.</b> Rival vs non-rival inputs; diminishing returns vs increasing returns; endogenous population (Malthus) vs exogenous; fixed factor (Malthus) vs reproducible capital (Solow) vs ideas (Romer). The escape from Malthus required technology to grow persistently and fertility to stop rising with income (demographic transition) – then the Romer/Solow world applies. Current debate: falling fertility is good for income levels in Solow but bad for long-run growth in Romer. Mention institutions (AJR) and Mokyr as deeper causes of why ideas are produced and adopted.</p>`,
  keys:["Antaganden för alla tre","Mekanismer i ord","Rival vs icke-rival","Befolkningens roll i varje modell (−/−/+)","Jämförande slutsats","Inga ekvationer/grafer"] },
{ id:"m6", t:"t4", src:"260320 Q1d", pts:5, q:R`A government promises not to tax or expropriate wealth to encourage investment. Why may the promise not be credible, what institutions could make it credible, and how does this help explain why the Industrial Revolution began in England rather than France?`,
  a:R`<p>Once investments are sunk, the government has an ex post incentive to expropriate or tax them heavily – the promise is <b>time inconsistent</b>; anticipating this, citizens under-invest. Credibility requires <b>constraints on the executive</b>: independent courts, parliament controlling taxation, secure property rights, rule of law, separation of powers, reputational/repeated interaction. After the Glorious Revolution (1688), Parliament constrained the English Crown, making property rights and public debt commitments credible; absolutist France lacked such constraints. Inclusive institutions in England encouraged investment and innovation (AJR, North & Weingast).</p>`, keys:["Tidsinkonsistens/ex post-incitament","Begränsningar av makten","Glorious Revolution / parlament"] },
{ id:"m7", t:"t4", src:"PS2 Q3", pts:10, q:R`Discuss: "Stronger patent protection and less competition necessarily lead to more innovation and faster growth." Also explain why inefficient institutions may persist.`,
  a:R`<p><b>For:</b> ideas are costly to create and non-rival; temporary market power (patents) lets innovators recover research costs. <b>Against:</b> excludability restricts diffusion of existing ideas (static inefficiency); strong incumbents may block entry and new technologies; Aghion–Howitt: competition and the threat of entry can spur innovation (escape competition), and business stealing means private and social returns differ; knowledge spillovers mean too strong protection hampers follow-on innovation. So more is not always better – a balance between rewards and competitive pressure.</p>
  <p><b>Persistence of inefficient institutions:</b> elites gain from extractive institutions and fear losing political power; promises to compensate them after reform are not credible (commitment problem); political power shapes economic rules and vice versa (AJR).</p>`, keys:["Incitament via marknadsmakt","Diffusion/spillovers","Konkurrens/creative destruction","Eliter och commitment problem"] },

// ===================== LABOR (t5) =====================
{ id:"l1", t:"t5", src:"251204 Q1d · 260508 Q3a–b", pts:10, q:R`Utility $U=\alpha\ln C+(1-\alpha)\ln(1-H)$, wage $w$, no other income. Write the budget constraint and solve for optimal C and H. How does H respond to w? What does this say about income and substitution effects?`,
  a:R`<p>Budget constraint: $C = wH$. Substitute: $\max_H \alpha\ln(wH) + (1-\alpha)\ln(1-H)$. FOC: $\frac{\alpha}{H} = \frac{1-\alpha}{1-H}$ ⇒ $\alpha(1-H) = (1-\alpha)H$ ⇒ $H^* = \alpha$, $C^* = \alpha w$.</p>
  <p>Hours do not depend on the wage. A higher wage makes leisure more expensive (substitution effect ⇒ work more) but makes the household richer (income effect ⇒ more leisure). With log preferences and no non-labor income these two effects <b>exactly cancel</b> – a property of this example, not a general result.</p>`, keys:["C = wH","FOC korrekt","H = α, C = αw","Inkomst- och substitutionseffekt tar ut varandra"] },
{ id:"l2", t:"t5", src:"251030 Q1d · 241029 Q1d", pts:5, q:R`An individual lives one period with $U(C,H) = \ln C - H^\gamma$ (or $\ln C - \alpha H$), wage $w$ and no other income. Solve for optimal C and H.`,
  a:R`<p>Budget constraint $C = wH$. $\max_H \ln(wH) - H^\gamma$. FOC: $\frac{1}{H} = \gamma H^{\gamma-1}$ ⇒ $H^\gamma = 1/\gamma$ ⇒ $H^* = (1/\gamma)^{1/\gamma}$, $C^* = w(1/\gamma)^{1/\gamma}$.</p>
  <p>Variant $\ln C - \alpha H$: FOC $1/H = \alpha$ ⇒ $H^*=1/\alpha$, $C^* = w/\alpha$.</p>
  <p>In both cases hours are independent of the wage: income and substitution effects cancel with log utility of consumption and only labor income.</p>`, keys:["Budget C = wH","FOC","H oberoende av w"] },
{ id:"l3", t:"t5", src:"260508 Q3c", pts:10, q:R`Same household ($\alpha\ln c + (1-\alpha)\ln(1-h)$), but now a labor income tax τ whose revenue is returned lump-sum: $c=(1-\tau)wh+T$, $T=\tau wH$. Solve for h. How does labor supply respond to τ?`,
  a:R`<p>The household takes $T$ (and aggregate $H$) as given. FOC: $\frac{\alpha(1-\tau)w}{c} = \frac{1-\alpha}{1-h}$. In equilibrium $h=H$, so $c = (1-\tau)wh + \tau wh = wh$. Substituting: $\frac{\alpha(1-\tau)}{h} = \frac{1-\alpha}{1-h}$ ⇒</p>$$h = \frac{\alpha(1-\tau)}{1-\alpha\tau}$$
  <p>$\partial h/\partial\tau < 0$ (at $\tau=0$, $h=\alpha$). The tax lowers the return on an extra hour (substitution effect) but because revenue is handed back, household income is not reduced – no offsetting income effect. The <b>substitution effect dominates</b> ⇒ labor supply falls. This is Prescott's explanation for lower hours in Europe.</p>`, keys:["FOC med (1−τ)w","Jämvikt c = wh","h = α(1−τ)/(1−ατ)","Substitutionseffekten dominerar"] },
{ id:"l4", t:"t5", src:"250319 Q1c · 260320 Q1c", pts:5, q:R`Keynes (1930) predicted a 15-hour week by 2030. What does this assume about income vs substitution effects? US hours per capita have been roughly stable despite ~2 % annual wage growth – what does that imply?`,
  a:R`<p>Productivity raises wages. A 15-hour week means people choose much more leisure as they get richer: Keynes assumed the <b>income effect dominates</b> the substitution effect of permanent wage increases. Roughly stable US hours despite rising wages imply that the two effects are of <b>similar size</b> (they roughly cancel, as with log utility). The modest long-run decline in hours (1870–today) suggests a slightly dominant income effect, far weaker than Keynes assumed.</p>`, keys:["Definiera båda effekterna","Keynes: inkomsteffekten dominerar","Stabila timmar ⇒ ungefär lika stora"] },
{ id:"l5", t:"t5", src:"PS3 Q2", pts:10, q:R`200 people of working age; 100 always employed. The other 100: 10 % of employed lose their job each period; of the unemployed 30 % find a job and 10 % become discouraged; 10 % of those outside are activated. (a) Steady-state equations (b) E, U, D and rates (c) activation rises to 60 %.`,
  a:R`<p><b>(a)</b> $sE_L = fU$: $0.1E_L = 0.3U$; $dU = aD$: $0.1U = 0.1D$; $E_L+U+D = 100$.</p>
  <p><b>(b)</b> $E_L = 3U$, $D = U$ ⇒ $5U=100$ ⇒ $U=20$, $E_L=60$, $D=20$. Total employed 160. Employment rate $160/200 = 80\%$; unemployment rate $20/180 = 11.1\%$.</p>
  <p><b>(c)</b> $a=0.6$: $D = U/6$, $E_L=3U$ ⇒ $U(3+1+1/6)=100$ ⇒ $U=24$, $E_L=72$, $D=4$. Employment rate $172/200=86\%$; unemployment rate $24/196 = 12.2\%$. <b>Both rise</b>: activation moves people from outside the labor force into unemployment; some find jobs (employment up), but the newly activated have weaker attachment than the always-employed group, so the unemployed share of the labor force rises. Activation policies cannot be judged by the unemployment rate alone.</p>`, keys:["Flödesekvationer","U=20, E=160, D=20","80 % / 11,1 %","86 % / 12,2 %","Förklaring heterogenitet"] },
{ id:"l6", t:"t5", src:"250509 Q6", pts:10, q:R`Workers separate at rate $s$ and the unemployed find jobs at rate $f$. (a) Solve for and interpret the equilibrium unemployment rate. (b) A technology lets workers search more effectively – effect?`,
  a:R`<p><b>(a)</b> $\Delta U = sE - fU$. Steady state $sE = fU$ with $E = L-U$ ⇒ $s(L-U) = fU$ ⇒ $u^* = U/L = s/(s+f)$. Inflows equal outflows; higher separation raises, higher job finding lowers unemployment.</p>
  <p><b>(b)</b> Better search raises $f$ ⇒ $u^*$ falls (lower frictional unemployment). Possibly also higher $s$ if on-the-job search increases job-to-job moves – ambiguous only if $s$ rises a lot.</p>`, keys:["sE = fU","u* = s/(s+f)","f↑ ⇒ u* ↓"] },

// ===================== CONSUMPTION (t6) =====================
{ id:"c1", t:"t6", src:"241206 Q1e · 250319 Q3 · 250509 Q3", pts:10, q:R`Two-period household: $\max \ln c_1 + \beta\ln c_2$ s.t. $c_1 + \frac{c_2}{1+r} = y_1 + \frac{y_2}{1+r}$. Derive the intertemporal budget constraint, the Euler equation (interpret) and optimal consumption.`,
