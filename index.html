  a:R`<p><b>IBC:</b> $c_1 = y_1 - s$, $c_2 = y_2 + (1+r)s$ ⇒ eliminate $s$: $c_1 + \frac{c_2}{1+r} = y_1+\frac{y_2}{1+r}$ (PV of consumption = PV of income).</p>
  <p><b>Euler:</b> substitute $c_2 = (1+r)(y_1-c_1)+y_2$, FOC: $u'(c_1) = \beta(1+r)u'(c_2)$; with log: $\frac{1}{c_1} = \frac{\beta(1+r)}{c_2}$ ⇒ $c_2 = \beta(1+r)c_1$.</p>
  <p><b>Interpretation:</b> at the optimum, the utility gain from consuming one more unit today equals the discounted utility of saving it and consuming $1+r$ units tomorrow. Higher β (patience) or higher r tilts consumption toward period 2; diminishing marginal utility makes the household smooth consumption; $c_1=c_2$ iff $\beta(1+r)=1$.</p>
  <p><b>Solution:</b> $c_1 + \frac{\beta(1+r)c_1}{1+r} = W$ ⇒ $c_1 = \frac{1}{1+\beta}\left(y_1+\frac{y_2}{1+r}\right)$, $c_2 = \frac{\beta(1+r)}{1+\beta}\left(y_1 + \frac{y_2}{1+r}\right)$.</p>`, keys:["IBC härledd","Euler-ekvation","Tolkning (marginal benefit = cost)","β och r:s roll","c₁, c₂ lösta"] },
{ id:"c2", t:"t6", src:"250509 Q3c–e · 260508 Q5", pts:15, q:R`Now $u(c)=\frac{c^{1-\sigma}-1}{1-\sigma}$ and $y_2 = 0$. Derive the Euler equation, show utility is increasing and concave, and solve for optimal consumption.`,
  a:R`<p>$u'(c) = c^{-\sigma} > 0$ (increasing), $u''(c) = -\sigma c^{-\sigma-1} < 0$ (diminishing marginal utility, for σ>0). Graph: increasing, concave curve.</p>
  <p>Euler: $c_1^{-\sigma} = \beta(1+r)c_2^{-\sigma}$ ⇒ $\frac{c_2}{c_1} = [\beta(1+r)]^{1/\sigma}$. $1/\sigma$ is the elasticity of intertemporal substitution.</p>
  <p>IBC with $y_2=0$: $c_1 + \frac{c_2}{1+r} = y_1$ ⇒ $c_1\left(1 + \frac{[\beta(1+r)]^{1/\sigma}}{1+r}\right) = y_1$ ⇒</p>
  $$c_1 = \frac{y_1}{1+\beta^{1/\sigma}(1+r)^{\frac{1}{\sigma}-1}},\qquad c_2 = [\beta(1+r)]^{1/\sigma}c_1$$
  <p>With σ = 1 (log): $c_1 = y_1/(1+\beta)$.</p>`, keys:["u' > 0, u'' < 0","Euler med CRRA","Lösning för c₁, c₂"] },
{ id:"c3", t:"t6", src:"241206 Q1c · 251204 Q1c", pts:5, q:R`Explain the Permanent Income Hypothesis. What key assumptions does it rely on?`,
  a:R`<p>Friedman's PIH: consumption depends on expected <b>lifetime (permanent) income</b>, not only current income. Households smooth consumption because of diminishing marginal utility, saving when income is temporarily high and borrowing when temporarily low. Hence a temporary income change has a small effect on consumption (in the two-period log model $\Delta c_1 = \Delta y_1/(1+\beta)$), whereas a permanent change shifts consumption roughly one-for-one.</p>
  <p><b>Assumptions:</b> forward-looking, rational households with correct expectations of future income; ability to borrow and save freely at the same interest rate (no borrowing constraints); intertemporal budget constraint (no debt left at the end); concave utility. When households are credit constrained or have little liquid wealth, MPC out of current income is high and the PIH fails – relevant for fiscal policy (multipliers, Ricardian equivalence).</p>`, keys:["Livsinkomst bestämmer konsumtion","Tillfällig vs permanent","Antaganden: framåtblickande, fri upplåning, samma ränta","Brister: likviditetsbegränsningar"] },
{ id:"c4", t:"t6", src:"PS5 Q7", pts:10, q:R`An economy has just integrated with richer economies: well-educated population, old capital stock, expected rapid income growth. (a) PIH implications for consumption and saving? (b) MPK and investment? (c) Current account?`,
  a:R`<p><b>(a)</b> Expected future income is high relative to current ⇒ households want to borrow against it: consumption high relative to current income, low (even negative) saving.</p>
  <p><b>(b)</b> Little and outdated capital but skilled labor ⇒ high MPK > r + δ ⇒ strong investment demand (and FDI).</p>
  <p><b>(c)</b> $CA = S - I$: low S and high I ⇒ large current-account deficits, financed by capital inflows (FA<0) – as in Eastern Europe/Baltics in the 2000s. Not necessarily bad if it finances productive investment, but exposes the country to sudden stops.</p>`, keys:["Låg sparkvot (PIH)","Hög MPK ⇒ hög I","CA = S − I < 0"] },
{ id:"c5", t:"t6", src:"260508 Q1c", pts:5, q:R`Some economists claim the equilibrium real rate $\bar r$ is determined by firms' profit maximization and equals the marginal product of capital. Do you agree?`,
  a:R`<p>Partly. From the investment decision, buying one unit of capital yields $MPK + 1 - \delta$ next period, which must equal $1+r$ ⇒ $MPK = r + \delta$, so in long-run equilibrium $\bar r = MPK - \delta$, not MPK itself (and with expected capital-goods price changes, $MPK = r+\delta - \Delta p^K/p^K$). Moreover $\bar r$ is an equilibrium price that also depends on household saving (patience β, the Euler equation), demographics, government debt, global capital flows and risk premia; the MPK adjusts through capital accumulation. So firms' optimization gives one condition, but $\bar r$ is jointly determined by saving and investment.</p>`, keys:["MPK = r + δ","Därför r̄ = MPK − δ","Sparande/utbud av kapital spelar också roll"] },

// ===================== IS–MP–PC (t7) =====================
{ id:"i1", t:"t7", src:"241206 Q3", pts:25, q:R`Economy at potential with $\pi=0$. (a) Illustrate in IS–MP and summarize assumptions. (b) Negative demand shock with a normal policy response. (c) Further negative shocks; policy at the lower bound and inflation starts to fall. (d) Two tools at the lower bound.`,
  a:R`<p><b>(a)</b> IS: $\tilde Y = \alpha - \beta(r-\bar r)$ – downward sloping because higher real rates reduce investment (and interest-sensitive consumption); demand determines output in the short run since prices are sticky. MP: the central bank sets the nominal rate and, with given expected inflation (Fisher $r = i-\pi^e$), effectively the real rate – horizontal line at $r = \bar r$. Starting point: IS and MP intersect at $\tilde Y = 0$; PC $\pi = \pi^e + \kappa\tilde Y$ gives $\pi=0$.</p>
  <p><b>(b)</b> Negative demand shock (α↓): IS shifts left. At unchanged $r$, $\tilde Y<0$ ⇒ via PC inflation falls below expectations. Normal response: lower $i$ ⇒ lower $r$, MP shifts down, economy moves down along new IS, output gap closed (fully or partly).</p>
  <p><b>(c)</b> Further shocks push IS further left; the policy rate hits its lower bound $i=0$ ⇒ MP becomes $r = 0 - \pi^e$. As inflation falls (negative gap in PC) and expectations follow, $r$ <b>rises</b> – MP shifts up – deepening the recession, lowering inflation further: a deflationary spiral (Great Depression, Japan). Monetary policy can no longer offset the shock.</p>
  <p><b>(d)</b> (1) <b>Quantitative easing</b>: buy long-term bonds ⇒ lower long yields and term premia, portfolio rebalancing, improved market functioning ⇒ lower borrowing rates for firms/households (lower effective $r+\rho$) ⇒ IS-movement right. (2) <b>Forward guidance</b>: commit to low rates for longer ⇒ lower expected future short rates and long rates; may raise inflation expectations ⇒ lower real rate. Others: negative policy rates, lending facilities to banks, and fiscal policy (shift IS right).</p>`,
  keys:["Antaganden IS (investering, stela priser) och MP (Fisher)","Diagram IS–MP + PC","Efterfrågechock: IS vänster, CB sänker r","ZLB: r = −πᵉ, deflationsspiral","QE och forward guidance med kanaler"], sim:"asad:demand_neg" },
{ id:"i2", t:"t7", src:"250319 Q5c · 260320 Q4c · 260508 Q4c", pts:5, q:R`The central bank has set $i_t=0$ and the economy is in recession. Using $r_t = i_t - \pi_t$, derive the ZLB-MP curve. What determines the real rate? Analyze how increased government spending can help.`,
  a:R`<p>With $i=0$: $r_t = -\pi_t$. Combining with the PC $\pi_t = \pi_{t-1}+\nu\tilde Y_t$ gives $r_t = -\pi_{t-1} - \nu\tilde Y_t$: in $(\tilde Y,r)$ space, MP<sub>ZLB</sub> slopes <b>downward</b>/is determined by (expected) inflation – the central bank no longer controls $r$; lower inflation raises the real rate.</p>
  <p><b>Government spending</b> raises α ⇒ IS shifts right ⇒ output gap less negative. Higher activity raises inflation via the PC ⇒ with $i$ stuck at 0, the real rate $r = -\pi$ <b>falls</b>, which raises investment further (movement along the new IS). The fiscal multiplier is larger than normally because monetary policy does not offset it (no crowding out) and the real rate falls. Effect: output ↑, real rate ↓, inflation ↑.</p>`, keys:["r = −π","CB styr inte r","G↑: IS höger","π↑ ⇒ r↓ ⇒ förstärkning (ingen crowding out)"] },
{ id:"i3", t:"t7", src:"PS3 Q4 · PS4 Q1", pts:12, q:R`Using IS–MP, analyze (with the goal of stabilizing output): (a) consumers become pessimistic; (b) IT raises MPK; (c) a European boom raises demand for domestic goods; (d) a housing bubble bursts; (e) an earthquake destroys many buildings.`,
  a:R`<ul><li><b>(a)</b> α_C↓ ⇒ IS shifts left ⇒ $\tilde Y<0$. Response: lower $r$ (MP down) to restore $\tilde Y=0$.</li>
  <li><b>(b)</b> Higher expected profitability ⇒ α_I↑ ⇒ IS shifts right. Also: $\bar r$ (the natural rate, MPK = r+δ) may rise and potential output rises. Raise $r$ to avoid overheating.</li>
  <li><b>(c)</b> α_EX↑ ⇒ IS right ⇒ raise $r$.</li>
  <li><b>(d)</b> Lower housing wealth and residential investment ⇒ IS left (and risk premia may rise) ⇒ cut $r$.</li>
  <li><b>(e)</b> Destroys capital ⇒ potential output falls (gap rises at given Y), but rebuilding raises investment demand ⇒ IS right; likely tighten. Net effect ambiguous – state assumptions.</li></ul>`, keys:["Rätt kurva skiftar för varje chock","Riktning i output gap","Policyrespons med MP-skift"] },
{ id:"i4", t:"t7", src:"PS5 Q3", pts:10, q:R`Imports depend on activity: $IM_t/\bar Y_t = \alpha_{IM} + \eta\tilde Y_t$. Derive the IS curve and explain why η appears in the denominator.`,
  a:R`<p>$\tilde Y = \alpha_C+\alpha_I-\beta(r-\bar r)+\alpha_G+\alpha_{EX} - \alpha_{IM} - \eta\tilde Y - 1$ ⇒ $\tilde Y(1+\eta) = \alpha - \beta(r-\bar r)$ ⇒</p>$$\tilde Y = \frac{\alpha - \beta(r-\bar r)}{1+\eta}$$
  <p>When domestic demand rises, part of it leaks abroad through higher imports, so domestic output rises by less: a demand shock raising α by 1 pp raises $\tilde Y$ by $1/(1+\eta)$. Sweden, as a small open economy with a high import share, likely has a larger η than the US.</p>`, keys:["Härledning","Import läcker efterfrågan","Sverige > USA"] },

// ===================== AS–AD (t8) =====================
{ id:"a1", t:"t8", src:"251030 Q3 (20p)", pts:20, q:R`Economy at $t=0$: $\tilde Y_0=0$, $\pi_0=\pi_0^*$. At $t=1$ a new chair announces a lower target $\bar\pi<\pi_0^*$. (a) Assumptions behind AS and AD. (b) Effects in periods 1 and 2 with $\pi^e_t=\pi_{t-1}$. (c) With $\pi^e_t = \alpha\pi^*_t + (1-\alpha)\pi_{t-1}$.`,
  a:R`<p><b>(a)</b> AD combines the IS curve (higher real rate ⇒ lower investment ⇒ lower output gap; demand shocks α) with a monetary-policy rule $r_t-\bar r = \mu(\pi_t-\pi^*)$: the central bank controls the real rate (Fisher, sticky expectations) and raises it when inflation exceeds target ⇒ $\tilde Y_t = \alpha - \beta\mu(\pi_t-\pi^*)$, downward sloping. AS is the expectations-augmented Phillips curve $\pi_t = \pi^e_t+\kappa\tilde Y_t+\sigma_t$: sticky prices/wages, high activity raises costs and prices; upward sloping, shifts with expectations and cost shocks. Potential output exogenous.</p>
  <p><b>(b)</b> Lower target ⇒ at every inflation rate the CB now wants a higher real rate ⇒ <b>AD shifts down/left</b> (vertical shift = $\pi_0^*-\bar\pi$). Period 1: $\pi^e_1 = \pi_0 = \pi^*_0$, so AS is unchanged. New intersection: inflation slightly lower, $\tilde Y_1<0$ (recession); the CB has raised $r$. Period 2: $\pi^e_2 = \pi_1 < \pi_0$ ⇒ AS shifts down ⇒ inflation falls further, output gap less negative. Over time AS shifts down until $\pi=\bar\pi$, $\tilde Y=0$. Disinflation is costly because expectations adjust slowly (Volcker, Sweden 1990s).</p>
  <p><b>(c)</b> Expectations now jump partially toward the new target: $\pi^e_1 = \alpha\bar\pi + (1-\alpha)\pi^*_0 < \pi^*_0$ ⇒ AS shifts down already in period 1. Inflation falls more and the recession is milder than in (b); in period 2 AS shifts down further (both via the target term and the lower $\pi_1$). Transition faster and cheaper; with $\alpha\to1$ (full credibility) inflation could fall to target without any output loss. Credibility = value of an independent, transparent central bank.</p>`,
  keys:["Antaganden AD (IS + regel) och AS (PC, adaptiva förv.)","AD skiftar ned när målet sänks","Period 1: AS oförändrad, recession","Period 2: AS skiftar ned","(c): AS skiftar redan i period 1, mildare","Rita AS–AD med märkta kurvor"], sim:"asad:target_down" },
{ id:"a2", t:"t8", src:"241029 Q3 (20p)", pts:20, q:R`Economy at potential with $\pi_t=\pi^*$. A new chair <b>raises</b> the long-run target to $\pi^{**}>\pi^*$. (b) Use AS–AD to show how the economy responds over time (no communication). (c) What if communication can control expectations?`,
  a:R`<p><b>(b)</b> Higher target ⇒ at given inflation the CB sets a lower real rate ⇒ AD shifts <b>up/right</b>. Period 1: $\pi^e = \pi^*$, AS unchanged ⇒ $\tilde Y_1>0$ (boom), inflation rises somewhat above $\pi^*$ but below $\pi^{**}$. Then expectations adapt: $\pi^e_2 = \pi_1$ ⇒ AS shifts up ⇒ inflation rises further, output gap shrinks. Gradually AS shifts up until $\pi = \pi^{**}$ and $\tilde Y=0$. Temporary boom, permanently higher inflation.</p>
  <p><b>(c)</b> If communication makes expectations jump immediately to $\pi^{**}$, AS shifts up at the same time as AD: inflation moves directly to the new target with no output gap. The transition is faster and without the boom. (Possibly risk of de-anchoring credibility of the target itself.)</p>`, keys:["AD skiftar upp","Boom i period 1","AS skiftar upp gradvis","Med kommunikation: direkt övergång utan gap"], sim:"asad:target_up" },
{ id:"a3", t:"t8", src:"250319 Q5 · 260320 Q4", pts:15, q:R`IS: $\tilde Y = \alpha-\beta(r-\bar r)$, rule $r-\bar r = \mu(\pi-\bar\pi)$, PC $\pi_t=\pi_{t-1}+\nu\tilde Y_t+\sigma$. (a) A one-year celebration raises consumption (temporary positive demand shock). (b) Energy prices rise sharply – why is this a dilemma? (c) Stricter target.`,
  a:R`<p><b>(a)</b> α↑ for one period ⇒ AD shifts right ⇒ $\tilde Y>0$, inflation rises; the CB raises $r$ according to the rule (movement along AD), dampening the boom. Next period α returns, AD shifts back, but $\pi^e = \pi_1>\bar\pi$ ⇒ AS remains above ⇒ inflation still above target with a slightly negative gap; CB keeps $r$ elevated and the economy gradually returns along AD to steady state.</p>
  <p><b>(b)</b> Cost shock σ>0 ⇒ AS shifts up ⇒ inflation up and output gap <b>negative</b> (the CB raises $r$ along the rule). Dilemma: fighting inflation deepens the recession; stabilizing output lets inflation (and expectations) rise. With a demand shock, inflation and output move in the same direction so tightening stabilizes both – no trade-off. With adaptive expectations the inflation persists after the shock; anchored expectations make it more temporary.</p>
  <p><b>(c)</b> Same as lowering the target: AD shifts down ⇒ temporary recession, gradual fall in inflation and expectations until $\pi=\bar\pi'$; credibility reduces the cost.</p>`, keys:["Efterfrågechock: AD skiftar","Persistens via förväntningar","Kostnadschock: AS skiftar, trade-off","Skillnaden mot efterfrågechock"], sim:"asad:cost" },
{ id:"a4", t:"t8", src:"260508 Q4a–b", pts:15, q:R`(a) Sweden permanently raises defense spending while households become more pessimistic. Analyze both shocks; state which dominates. (b) Unions negotiate a large wage increase exceeding productivity growth – trade-off? Is the dilemma more severe if wage growth persists?`,
  a:R`<p><b>(a)</b> Defense spending: G↑ ⇒ α↑ ⇒ IS/AD right. Pessimism: C↓ ⇒ α↓ ⇒ IS/AD left. Net effect depends on sizes. E.g. assume the permanent spending increase dominates (large, persistent program; pessimism temporary) ⇒ AD shifts right, $\tilde Y>0$, inflation rises ⇒ CB raises $r$ along the rule; if spending is permanent, $\bar r$ may rise. Alternatively if pessimism dominates, AD shifts left and the CB cuts rates. State the assumption clearly!</p>
  <p><b>(b)</b> Wage increases above productivity raise unit labor costs ⇒ cost-push shock σ>0 ⇒ AS shifts up ⇒ higher inflation and lower output; the CB faces a trade-off between price stability and activity (unlike a demand shock). If wage growth persists over several years, σ>0 repeatedly and inflation expectations risk becoming entrenched (wage–price spiral) ⇒ dilemma <b>more severe</b>: the CB must tighten more to anchor expectations, causing a larger recession. A one-off increase can be "looked through" if expectations stay anchored.</p>`, keys:["Två motverkande skift","Tydligt antagande om dominans","Lönechock = kostnadschock","Persistens förvärrar dilemmat"] },
{ id:"a5", t:"t8", src:"260320 Q4d · 260508 Q4d", pts:5, q:R`A new governor wants to permanently raise money growth to keep output above potential. Show the short-run effect in AS–AD and explain why the output gap cannot stay positive in the long run.`,
  a:R`<p>Short run: more expansionary policy (effectively a higher inflation target / lower real rate) shifts AD right ⇒ $\tilde Y>0$ and higher inflation, since expectations are given. Long run: by the PC $\pi_t = \pi^e_t+\nu\tilde Y_t$, a positive gap requires inflation permanently above expectations; but expectations adapt ($\pi^e_t=\pi_{t-1}$), so AS keeps shifting up. A constant positive gap would require <b>ever-accelerating</b> inflation. Once agents expect the higher inflation, $\pi=\pi^e$ and $\tilde Y=0$: the long-run Phillips curve is vertical. Outcome: higher inflation, no lasting output gain (cf. inflation bias / time inconsistency).</p>`, keys:["AD höger, kort sikt boom","Förväntningar anpassas, AS upp","Vertikal långsiktig PC","Högre inflation, ingen permanent vinst"] },
{ id:"a6", t:"t8", src:"241029 · 241206 · 251204 Q1", pts:5, q:R`State the Fisher equation. Explain what is meant by the Taylor principle and the logic behind it.`,
  a:R`<p><b>Fisher equation:</b> $r_t \approx i_t - \pi^e_t$ – the real interest rate equals the nominal rate minus expected inflation (exactly $1+r = (1+i)/(1+\pi^e)$).</p>
  <p><b>Taylor principle:</b> the central bank should raise the nominal policy rate <b>more than one-for-one</b> in response to an increase in inflation. In the Taylor rule $i_t = \pi_t + \bar r + \mu(\pi_t-\pi^*) + \omega\tilde Y_t$ with μ>0, a 1 pp rise in inflation raises $i$ by $1+\mu$ (1.5 with μ=0.5).</p>
  <p><b>Logic:</b> spending depends on the real rate. If $i$ rose less than inflation, the real rate would <i>fall</i> when inflation rises ⇒ more demand ⇒ positive output gap ⇒ even higher inflation via the Phillips curve: unstable, self-reinforcing inflation (as in the 1970s). Raising $i$ by more ensures $r$ rises, demand falls and inflation is pulled back to target – it makes the AD curve downward-sloping and anchors expectations.</p>`, keys:["r = i − πᵉ","Mer än ett-till-ett","Realräntan måste stiga","Instabilitet annars (1970-tal)"] },
{ id:"a7", t:"t8", src:"251030 Q5 · 251204 Q5", pts:10, q:R`One period. Households form $\pi^e$, then the policymaker chooses π. $y = \bar y + \kappa(\pi-\pi^e)$ and loss $L = \pi^2 - \lambda y$. (a) π as a function of $\pi^e$. (b) Equilibrium with $\pi^e = \pi$. (c) Why does λ matter?`,
  a:R`<p><b>(a)</b> Substitute: $L = \pi^2 - \lambda[\bar y + \kappa(\pi-\pi^e)]$. FOC: $2\pi - \lambda\kappa = 0$ ⇒ $\pi = \lambda\kappa/2$ – here independent of $\pi^e$ (linear loss in y).</p>
  <p><b>(b)</b> Rational expectations: $\pi^e = \pi = \lambda\kappa/2 > 0$, so $y = \bar y$. Inflation is positive without any output gain – <b>inflation bias</b>.</p>
  <p><b>(c)</b> λ measures how much the policymaker values output. The larger λ, the greater the temptation to create surprise inflation; households anticipate it, so equilibrium inflation is higher. Lesson: delegate to an independent, "conservative" central bank (low λ) or commit to a rule.</p>
  <p><i>Variant (Dec 2025):</i> $u = \bar u - \phi(\pi-\pi^e)$, $L = \pi^2 + \lambda u$ ⇒ $\pi = \lambda\phi/2$, $u = \bar u$.</p>`, keys:["FOC 2π − λκ = 0","π = πᵉ = λκ/2","y = ȳ","Tolkning av λ, oberoende CB"] },

// ===================== MONETARY PRACTICE / MONEY (t9) =====================
{ id:"p1", t:"t9", src:"251030 Q4 (essä, 20p)", pts:20, q:R`<b>Essay:</b> (i) Besides oil and other supply shocks, list three factors that contributed to the Great Inflation of the 1970s and explain how. (ii) Why may the 2021–22 inflation surge have been less persistent?`,
  a:R`<p><b>(i) Factors:</b></p><ol>
  <li><b>Monetary policy violated the Taylor principle</b> – the Fed raised nominal rates by less than inflation, so real rates fell and stimulated demand, feeding inflation (Taylor rule analyses).</li>
  <li><b>Mismeasured potential output</b> – the productivity slowdown of the 1970s was not recognized in real time; policymakers believed there was a large negative output gap and kept policy too loose (real-time vs retrospective gap estimates).</li>
  <li><b>Unanchored expectations / lack of credibility and independence</b> – political pressure (e.g. Nixon–Burns), belief in an exploitable Phillips curve trade-off, no clear nominal anchor after Bretton Woods ⇒ time-inconsistency/inflation bias; adaptive expectations made each shock persist (AS kept shifting up).</li>
  <li>(Also) Expansionary fiscal policy (Vietnam War, Great Society), wage indexation and wage–price spirals.</li></ol>
  <p><b>(ii) 2021–22:</b> Central banks had <b>inflation targets and independence</b> with decades of credibility ⇒ long-run expectations remained anchored, so AS did not keep shifting up. Central banks eventually tightened forcefully, obeying the Taylor principle. The shocks were largely <b>temporary</b> (supply-chain disruptions, energy prices, demand shifts goods→services) and reversed. Better understanding of expectations and communication. Remaining risk: delayed reaction ("transitory") and fiscal support contributed.</p>`, keys:["Tre faktorer med mekanism","Taylorprincipen bröts","Felmätt output gap","Förankrade förväntningar/oberoende idag","Tillfälliga chocker 2021–22"] },
{ id:"p2", t:"t9", src:"250319 Q4 · 250509 Q4 · 260320 Q5", pts:10, q:R`Island economy: $M_tV = P_tY_t$, $Y_t = L_t$, shopkeepers set prices at end of day: $P_{t+1}/P_t = (L_t/L^*)^\theta$. A treasure raises M by Δlog M one morning. (a) Effect that day? (b) The next day and in the long run?`,
  a:R`<p><b>(a)</b> Prices are fixed during the day ⇒ $\Delta\log Y = \Delta\log M$ (V constant): output and hours rise above $L^*$; prices unchanged.</p>
  <p><b>(b)</b> At the end of day 0, since $L_0>L^*$, shopkeepers raise prices: $\Delta\log P_1 = \theta(\log L_0 - \log L^*) = \theta\Delta\log M$. Day 1 output: $\log Y_1 = \log M + \log V - \log P_1$ ⇒ output still above $L^*$ but by $(1-\theta)\Delta\log M$. The process repeats: the gap shrinks geometrically by factor $(1-\theta)$ each day. Long run: $P$ rises by Δlog M in total, output returns to $L^*$ – <b>money is neutral in the long run</b> but not in the short run because of price stickiness. Higher θ = faster adjustment.</p>`, keys:["Dag 0: Y upp, P oförändrat","Prisjustering θ","Gapet krymper med (1−θ)","Långsiktig neutralitet"] },
{ id:"p3", t:"t9", src:"250319 Q1d · 260508 Q1d", pts:5, q:R`Explain price rigidity (sticky prices). What does it imply for the effect of increased money supply on output?`,
  a:R`<p>Prices (and wages) adjust slowly: menu costs, contracts, information frictions, firms set prices in advance and meet demand at those prices. With sticky prices, an increase in M (lower interest rates) raises nominal spending, and since P cannot adjust immediately, real output rises in the short run (quantity equation: $MV=PY$ with P fixed). Over time prices adjust and output returns to potential; in the long run money is neutral. Without rigidity, money would only affect prices (classical dichotomy).</p>`, keys:["Definition + orsaker","Kort sikt: Y påverkas","Lång sikt: neutralitet"] },
{ id:"p4", t:"t9", src:"250319 Q1e", pts:5, q:R`Evaluate: "The Phillips curve describes the options of the policymaker: low inflation and high unemployment, or high inflation and low unemployment, or anywhere in between."`,
  a:R`<p>Only true in the short run with given expectations. The expectations-augmented PC $\pi = \pi^e + \kappa\tilde Y$ shows that the trade-off is between <i>unexpected</i> inflation and activity. If policy tries to keep unemployment permanently low, expectations adapt, the PC shifts up and inflation accelerates; in the long run unemployment returns to its natural rate (vertical long-run PC – Friedman/Phelps, 1970s stagflation). With rational expectations and time inconsistency, attempts to exploit it only produce inflation bias. Supply shocks also shift the curve.</p>`, keys:["Gäller bara kort sikt","Förväntningar skiftar PC","Vertikal långsiktig PC","1970-tal stagflation"] },
{ id:"p5", t:"t9", src:"250509 Q1e", pts:5, q:R`Theory and experience suggest hyperinflations should be ended quickly by highly visible "shock therapy". Explain using the Phillips curve.`,
  a:R`<p>$\pi_t = \pi^e_t + \kappa\tilde Y_t$. With adaptive expectations, gradual disinflation requires a long period of negative output gaps (each period AS shifts down only by the realized inflation drop). If a visible, credible regime change (new central bank law, currency reform, fiscal reform ending money financing) makes expectations jump down immediately, $\pi^e$ falls directly and inflation can be reduced with a much smaller output loss. Credibility, not gradualism, lowers the sacrifice ratio; fiscal reform is crucial since hyperinflations stem from monetary financing of deficits.</p>`, keys:["PC med förväntningar","Gradvis = lång recession","Trovärdig regimändring sänker πᵉ direkt"] },

// ===================== FISCAL (t10) =====================
{ id:"f1", t:"t10", src:"241029 Q1a · 251030 Q1c", pts:5, q:R`Explain Ricardian equivalence. Is it likely to hold in reality? Why/why not?`,
  a:R`<p>Ricardian equivalence states that, for a given path of government purchases, the <b>timing of lump-sum taxes</b> (tax vs debt financing) does not affect household consumption. Combining the government's intertemporal budget constraint $T_1 + \frac{T_2}{1+i} = G_1 + \frac{G_2}{1+i}$ with the household's shows lifetime resources equal PV(income) − PV(G). A debt-financed tax cut today implies a future tax increase of equal present value; rational households save the entire tax cut, so consumption and aggregate demand are unchanged.</p>
  <p><b>In reality, likely not fully:</b> many households are credit-constrained or hold little liquid wealth ⇒ high MPC out of tax cuts; households may be myopic or not understand the budget constraint; future taxes may fall on future generations households do not care about; taxes are distortionary, not lump-sum; uncertainty about who pays. Empirically tax rebates raise consumption somewhat. Still, partial Ricardian effects make debt-financed stimulus weaker than the Keynesian cross suggests.</p>`, keys:["Definition (timing av klumpsummeskatter)","Statens + hushållens IBC","Skattesänkning sparas","Skäl till att den brister"] },
{ id:"f2", t:"t10", src:"241029 Q1e", pts:5, q:R`Explain the difference between automatic stabilizers and discretionary fiscal policy. Give three examples and classify them.`,
  a:R`<p><b>Automatic stabilizers</b> are features of taxes and transfers that change automatically with economic conditions without new decisions; they dampen fluctuations quickly and predictably. <b>Discretionary policy</b> requires active decisions in response to conditions and suffers from decision, implementation and impact lags.</p><ul>
  <li>Progressive income taxes – revenue falls more than income in a recession (<b>automatic</b>).</li>
  <li>Unemployment benefits – spending rises when unemployment rises (<b>automatic</b>).</li>
  <li>A temporary tax rebate or new infrastructure investment program decided in a recession (<b>discretionary</b>).</li></ul>`, keys:["Definitioner","Tre exempel klassificerade","Fördelar/nackdelar (lags)"] },
{ id:"f3", t:"t10", src:"251030 Q1b", pts:5, q:R`Why is a fiscal stimulus argued to have larger effects on output and inflation when the policy rate is at its lower bound?`,
  a:R`<p>Normally, a fiscal expansion shifts IS right, raising output and inflation, and the central bank responds by raising the real rate (Taylor rule) ⇒ private investment and consumption are <b>crowded out</b> and the multiplier is small. At the lower bound, the central bank wants a lower rate than possible, so it does not raise the nominal rate in response. Moreover, higher inflation (and expected inflation) with a fixed $i$ <b>lowers</b> the real rate $r = i - \pi^e$, stimulating demand further. Hence the multiplier is larger (accommodating monetary policy), and with slack in the economy the effect on output is especially strong.</p>`, keys:["Normalt: crowding out via r↑","ZLB: ingen räntehöjning","π↑ ⇒ r↓ förstärker"] },
{ id:"f4", t:"t10", src:"241206 Q5", pts:10, q:R`(a) Derive how the primary balance (share of GDP) and existing debt ratio affect the change in the debt ratio. (b) What is required to stabilize the debt ratio, and what trade-off do governments face?`,
  a:R`<p><b>(a)</b> Budget constraint: $G_t + (1+i)B_t = T_t + B_{t+1}$ ⇒ $B_{t+1} = (1+i)B_t - S^P_t$ with $S^P = T-G$. Divide by $Y_{t+1} = (1+g)Y_t$: $b_{t+1} = \frac{1+i}{1+g}b_t - \frac{s^P_t}{1+g}$ ⇒ $(1+g)b_{t+1} = (1+i)b_t - s^P_t$ ⇒ approximately</p>$$b_{t+1}-b_t \approx (i-g)b_t - s^P_t$$
  <p><b>(b)</b> Stable ratio: $s^P = (i-g)b$. If $i>g$, a government with debt must run primary surpluses, larger the higher the debt and the interest–growth gap. Trade-off: fiscal consolidation (higher taxes, lower spending) reduces demand and possibly growth in the short run – which itself worsens debt dynamics – and is politically costly, while postponing it raises debt, interest costs, refinancing risk and risk premia (doom loop), reducing future fiscal space.</p>`, keys:["Budgetrestriktion","Division med nominell BNP","Δb ≈ (i−g)b − sᴾ","sᴾ = (i−g)b","Trade-off konsolidering vs efterfrågan"] },
{ id:"f5", t:"t10", src:"PS5 Q1–2", pts:10, q:R`US: nominal GDP growth 4.6 %, 10-year rate 3.4 % historically, debt 127 % of GDP. (a) Debt-stabilizing primary balance? (b) Now i = 5.1 %, g = 4.1 %, primary deficit 3.7 %: (i) debt ratio after one year? (ii) required consolidation? (c) i = 0.7 %, g = 4.1 %: rolling over a bond – how does B/Y evolve?`,
  a:R`<p><b>(a)</b> $s^P = (0.034-0.046)\times1.27 = -1.5\%$ – a primary <b>deficit</b> of about 1.5 % of GDP stabilizes debt.</p>
  <p><b>(b)(i)</b> Exact: $b' = \frac{(1.051)(1.27) + 0.037}{1.041} \approx 1.318$ ⇒ <b>≈131.8 %</b> (approximation: $1.27 + 0.01\cdot1.27 + 0.037 \approx 132\%$). <b>(ii)</b> Required $s^P = 0.01 \times 1.27 = +1.27\%$; from −3.7 % that is a consolidation of about <b>5 % of GDP</b>.</p>
  <p><b>(c)</b> $B_{t+1}=(1+i)B_t$ while $Y$ grows at $g$ ⇒ $B/Y$ falls by factor $1.007/1.041 \approx 0.967$ per year (~3.3 %) ⇒ converges to 0: a "free lunch". Problems: interest rates may rise above growth (as in 2022–26), refinancing risk, the marginal rate increases with debt, crowding out, and confidence can shift abruptly.</p>`, keys:["−1,5 %","≈ 132 %","Konsolidering ≈ 5 pe","B/Y krymper ~3 %/år","Risker"] },
{ id:"f6", t:"t10", src:"241206 Q4 · 251204 Q4 (essä)", pts:15, q:R`<b>Essay:</b> Public debt has increased and concerns have emerged about fiscal sustainability. Explain how such concerns can threaten price stability and the trade-offs the central bank faces (flexible exchange rate).`,
  a:R`<p><b>1. Debt dynamics.</b> $\Delta b \approx (i-g)b - s^P$. If markets doubt that future primary surpluses will be large enough, something else must adjust.</p>
  <p><b>2. Channels to inflation:</b></p><ul>
  <li><b>Fiscal theory/Sargent</b>: if surpluses will not back the debt, the real value of nominal debt can be reduced through a higher price level – "inflation is always and everywhere a fiscal phenomenon".</li>
  <li><b>Fiscal dominance</b>: pressure on the central bank to keep rates low or to buy government bonds (monetary financing), since higher rates raise interest costs; if the public expects this, inflation expectations rise and AS shifts up.</li>
  <li><b>Risk premia and the exchange rate</b>: investors demand higher yields and may sell domestic assets ⇒ currency <b>depreciates</b> (flexible rate) ⇒ import prices and inflation rise (pass-through, cost shock).</li>
  <li>Financial repression; time-inconsistency temptation to inflate away debt.</li></ul>
  <p><b>3. Central bank trade-offs.</b> Raising rates to fight inflation worsens debt dynamics (higher $i$, lower $g$), may increase default risk, risk premia and bank losses (banks hold government bonds) – a doom loop and financial instability; it may conflict with the government (independence under pressure). Not raising rates lets expectations de-anchor and inflation rise. QE/bond purchases to stabilize markets blur monetary and fiscal policy and may signal fiscal dominance. Historical: WWII rate peg and the 1951 Treasury–Fed Accord; current: political pressure on the Fed, high debt and bond sell-off 2026.</p>
  <p><b>4. Safeguards.</b> Central bank independence, credible fiscal frameworks (Swedish surplus/balance target, debt anchor, expenditure ceiling, Fiscal Policy Council), EU ban on monetary financing.</p>`, keys:["Skulddynamik i ord","Fiscal dominance","Prisnivån justerar realvärdet (Sargent)","Växelkurs/riskpremie ⇒ importinflation","CB:s trade-off: räntehöjning förvärrar skulden","Institutionella skydd"] },
{ id:"f7", t:"t10", src:"PS4 Q2", pts:10, q:R`Monetary policy follows $r_t-\bar r = \xi\tilde Y_t$ (MPR). Compare a positive demand shock (e.g. fiscal stimulus) in IS/MP vs IS/MPR. What is "crowding out"?`,
  a:R`<p>MPR is an upward-sloping line in $(\tilde Y,r)$. With a standard horizontal MP the IS shift raises $\tilde Y$ by the full horizontal shift. With MPR the central bank raises $r$ as output rises ⇒ the economy moves up along MPR ⇒ smaller output increase. <b>Crowding out</b>: the higher real interest rate reduces private investment (and interest-sensitive consumption, and net exports in an open economy), offsetting part of the increase in government demand.</p>`, keys:["MPR uppåtlutande","Mindre ökning i Ỹ","Privat investering trängs ut"] },

// ===================== OPEN ECONOMY (t11/t12) =====================
{ id:"o1", t:"t11", src:"251204 Q3 (25p)", pts:25, q:R`Small open economy, floating rate, at potential with inflation at target. A foreign recession makes the foreign central bank temporarily cut its rate. (a) Home rate unchanged – how does the exchange rate respond (interest parity)? (b) Use AS–AD: output gap, nominal rate, inflation and expectations over time. (c) Suggest one additional spillover.`,
  a:R`<p><b>(a)</b> UIP: $e_t \approx i_t - i^w_t + e^e_{t+1}$. With $i^w\downarrow$, $i$ and $e^e_{t+1}$ unchanged, domestic assets become relatively more attractive ⇒ demand for home currency rises ⇒ <b>immediate appreciation</b> ($E\uparrow$). (Thereafter expected to depreciate back as the foreign rate normalizes.)</p>
  <p><b>(b)</b> With sticky prices, $Q = EP/P^w$ appreciates ⇒ net exports fall: in the open-economy IS, $\tilde Y = \alpha - \beta(r-\bar r)$ with $\alpha$ containing $\beta_{NX}(r^w-\bar r)$ ⇒ α falls ⇒ <b>AD shifts left</b>. Period 1: $\pi^e$ given ⇒ $\tilde Y<0$, inflation falls below target; the home central bank <b>cuts</b> its nominal rate along the rule (which partly offsets via both investment and a weaker currency). Period 2: $\pi^e_2 = \pi_1 < \pi^*$ ⇒ AS shifts down; while the foreign rate stays low AD remains left. When the foreign rate returns to normal, AD shifts back right; with expectations below target, the economy now has inflation below target but the gap turns positive/closes, and AS gradually shifts back up until steady state at potential and target. Throughout: lower inflation expectations, lower nominal rate, temporarily negative gap.</p>
  <p><b>(c)</b> (i) The foreign recession lowers <b>foreign demand for home exports</b> ⇒ additional leftward IS/AD shift. (ii) Direct <b>exchange-rate pass-through</b>: the appreciation makes imports cheaper ⇒ lower inflation directly (negative cost shock, AS shifts down), which reduces inflation further but softens the output loss. (iii) Lower foreign commodity prices, confidence/financial spillovers.</p>`, keys:["UIP: appreciering","Q↑ ⇒ NX↓ ⇒ AD vänster","CB sänker räntan","Förväntningar och AS över tid","Återgång när utländsk ränta normaliseras","Extra kanal: exportefterfrågan/pass-through"], sim:"asad:demand_temp_neg" },
{ id:"o2", t:"t11", src:"241029 Q1b", pts:5, q:R`Explain purchasing power parity. Is it likely to hold? Why/why not?`,
  a:R`<p>PPP applies the <b>law of one price</b> to price levels: arbitrage should equalize the price of a basket across countries in a common currency. <b>Absolute PPP</b>: $P^w = EP$, so the real exchange rate $Q=1$. <b>Relative PPP</b>: exchange-rate changes offset inflation differentials, $\Delta\ln E \approx \pi^w-\pi$. Developed by Gustav Cassel.</p>
  <p>It holds poorly in the short run and imperfectly even in the long run: transport costs and trade barriers; <b>non-tradable</b> goods and services (haircuts, rents); different consumption baskets; imperfect competition and pricing to market; sticky prices while nominal exchange rates move with capital flows (UIP). The <b>Balassa–Samuelson</b> effect predicts systematically higher price levels in rich countries. Big Mac index shows large deviations; tradables like iPhones show small ones. PPP is a useful long-run benchmark (relative PPP works better over long horizons and high-inflation countries).</p>`, keys:["LOOP och arbitrage","Absolut vs relativ","Skäl till avvikelser","Balassa–Samuelson / Big Mac"] },
{ id:"o3", t:"t11", src:"250509 Q1a · 260320 Q1f", pts:5, q:R`Country B has higher productivity in the tradables sector than country A. Compare price levels and explain the mechanism.`,
  a:R`<p>B should have a <b>higher price level</b> (Balassa–Samuelson). Tradable goods prices are equalized internationally (law of one price), so higher tradables productivity in B means higher wages in B's tradables sector. Labor mobility equalizes wages across sectors within each country, so wages in B's non-tradables (services) sector are also high, even if productivity there is similar to A's. Hence non-tradables are more expensive in B and the overall price level (in common currency) is higher – B has a stronger real exchange rate. Countries catching up through tradables productivity experience real appreciation.</p>`, keys:["B högre prisnivå","LOOP för handlade varor","Lönerna utjämnas mellan sektorer","Icke-handlade dyrare"] },
{ id:"o4", t:"t11", src:"250509 Q1c · 260508 Q1e", pts:5, q:R`The interest rate in Euroland is 4 % and in Sweden 2 %. What do you expect to happen to the exchange rate between the euro and the krona?`,
  a:R`<p>UIP: $1+i_{SE} = (1+i_{EU})E_t/E^e_{t+1}$ (E = EUR per SEK). For investors to be indifferent between 2 % in SEK and 4 % in EUR, the krona must be expected to <b>appreciate by about 2 % per year</b> against the euro (the euro expected to depreciate). If the rate differential just opened up (e.g. ECB raised rates), the krona would first depreciate immediately (capital flows to euro assets), to a level from which it is expected to appreciate. Caveats: risk premia, UIP often fails empirically (carry trade).</p>`, keys:["UIP-formel","Kronan förväntas appreciera ~2 %/år","Omedelbar depreciering vid ändrat gap","Riskpremier"] },
{ id:"o5", t:"t11", src:"250319 Q5d", pts:5, q:R`Sweden is in a monetary union. All other members experience an inflationary price shock and the ECB tightens. Effect on Sweden?`,
  a:R`<p>Sweden has no price shock but faces the common higher interest rate: $r\uparrow$ ⇒ investment falls ⇒ <b>AD shifts left</b> (common policy is a negative demand shock for Sweden). Output falls below potential and Swedish inflation falls below target. No exchange-rate adjustment within the union; Swedish goods become relatively cheaper over time (real depreciation via lower inflation), partly offsetting. Possibly higher demand from euro partners if their nominal spending rises. Illustrates the cost of losing monetary independence when shocks are asymmetric; adjustment must come through prices, wages or fiscal policy.</p>`, keys:["Högre ränta = negativ efterfrågechock","AD vänster, lägre π och Ỹ","Ingen växelkursjustering","Asymmetriska chocker"] },
{ id:"o6", t:"t11", src:"PS5 Q4–6", pts:15, q:R`AS/AD for the US: (a) ECB cuts rates; (b) a currency crisis abroad raises demand for dollars (flight to safety); (c) foreign investors become reluctant to hold US assets.`,
  a:R`<p><b>(a)</b> $i^w\downarrow$ ⇒ dollar appreciates ⇒ US NX↓ ⇒ AD left ⇒ negative gap, lower inflation; Fed cuts along its rule; as ECB normalizes, AD shifts back and the economy returns to steady state.</p>
  <p><b>(b)</b> Higher demand for dollar assets ⇒ dollar appreciates (and lower US yields). To get dollars the rest of the world must sell goods/assets to the US: US net exports fall (capital inflow, CA deficit) ⇒ AD shifts left (partly offset by lower US interest rates). Inflation falls, also via cheaper imports.</p>
  <p><b>(c)</b> Opposite: capital outflows ⇒ dollar depreciates ⇒ NX↑ ⇒ AD right ⇒ positive gap and inflation (plus import-price pass-through, cost shock). But if reluctance raises US risk premia/long rates, investment falls ⇒ AD left. State which dominates; in the exchange-rate-dominant case the trade deficit unwinds: CA = S − I rises.</p>`, keys:["UIP-kanalen","NX och AD","CB-respons","Tydligt antagande om dominerande effekt"] },
{ id:"o7", t:"t12", src:"251030 Q1e · 251204 Q1e", pts:5, q:R`After World War II, when much of Europe lay in ruins, the United States ran a trade surplus. Use the relation between the trade balance and capital flows to give a hypothesis.`,
  a:R`<p>From $Y = C+I+G+NX$: $NX = (Y-T-C)+(T-G)-I = S - I$, and $CA = FA$. Europe had to rebuild its destroyed capital stock: investment demand (and consumption needs) far exceeded what its depleted incomes could save ⇒ Europe ran current-account deficits financed by borrowing from abroad. The US, with an intact capital stock, high income and high saving (wartime rationing, government surpluses after demobilization), had $S > I$: it lent to Europe (capital outflows, e.g. the Marshall Plan and loans, $FA>0$), and the counterpart was exports of goods exceeding imports – a US trade surplus. Europe imported American goods financed by these capital flows.</p>`, keys:["NX = S − I","CA = FA","Europa: I ≫ S","USA lånade ut ⇒ handelsöverskott"] },
{ id:"o8", t:"t12", src:"250509 Q1d · 260508 Q1b", pts:5, q:R`Use the national income identity to show how saving and investment are related in a small open economy. How does this differ in a closed economy?`,
  a:R`<p>$Y = C+I+G+NX$ ⇒ $Y - C - G = I + NX$. Adding and subtracting taxes: $(Y-T-C) + (T-G) = S = I + NX$, so $S - I = NX$ (= CA when ignoring net foreign income and transfers). In an open economy domestic investment can exceed national saving, financed by foreign borrowing (capital inflows); excess saving is lent abroad. In a closed economy $NX = 0$ ⇒ $S = I$: investment is constrained by domestic saving, and the interest rate adjusts to equate them.</p>`, keys:["Härledning","Privat + offentligt sparande","S − I = NX","Sluten: S = I"] },
{ id:"o9", t:"t12", src:"Prognos (LN11)", pts:10, q:R`Does dollar dominance require persistent US current-account deficits? Can tariffs improve the US trade balance? (Use CA = S − I.)`,
  a:R`<p><b>Dollar dominance:</b> The original Triffin dilemma concerned Bretton Woods: growing demand for dollar reserves vs. confidence in gold convertibility. Today foreigners can acquire Treasuries from existing holders; reserve demand may lower US yields (convenience yield) and strengthen the dollar, but a CA deficit requires $S<I$. Accounting identities ($FA = CA = S - I$) are not causality – a mechanism through saving and investment is needed. Evidence: US deficits persisted since 2015 though official purchases have been small ⇒ not mechanically required.</p>
  <p><b>Tariffs:</b> If $S - I$ is unchanged, lower import demand reduces demand for foreign currency ⇒ dollar appreciates ⇒ exports fall, imports partly recover ⇒ aggregate NX barely changes (composition changes). Tariffs improve NX only if they raise national saving (tariff revenue raising public saving) or reduce investment (uncertainty, higher input costs) – the latter is not desirable. US CA deficit ~3.7 % of GDP in 2025 despite tariffs.</p>`, keys:["Triffin original vs moderna","Accounting ≠ causality","Tullar: dollarn apprecierar","NX = S − I måste ändras"] },
{ id:"o10", t:"t12", src:"Prognos (LN11b)", pts:5, q:R`$i = 5\%$, nominal GDP growth $g = 4\%$, and the US runs a current-account deficit of 4 % of GDP forever. Where does the NIIP-to-GDP ratio stabilize, and what trade balance is needed?`,
  a:R`<p>$(1+g)niip_{t+1} = niip_t + ca_t$ ⇒ stable: $ca = g\cdot niip$ ⇒ $niip = -0.04/0.04 = -100\%$ of GDP. With $NFI = i\cdot NIIP$: $nx = -(i-g)niip = -(0.01)(-1) = +1\%$ of GDP – a trade <b>surplus</b> is needed because interest payments on the net debt (5 %) exceed the CA deficit. With a favorable return differential ($r^A > r^L$, exorbitant privilege) or dollar depreciation (valuation effects), a trade deficit could be sustained.</p>`, keys:["ca = g·niip","niip = −100 %","nx = −(i−g)niip = +1 %","Avkastningsdifferens/värdering"] },

// ===================== MEASUREMENT (t1) – nytt 2026 =====================
{ id:"n1", t:"t1", src:"Prognos (PS1 Q1–2)", pts:10, q:R`India's GDP (2019) 195 trillion rupees; US 20.6 trillion USD; exchange rate 70.4 rupees/USD; India's price level 30.3 % of the US. (a) Ratio at market exchange rate. (b) PPP ratio. (c) Why different?`,
  a:R`<p><b>(a)</b> $195/70.4 = 2.77$ trillion USD ⇒ $2.77/20.6 \approx 13.4\%$ of US GDP.</p>
  <p><b>(b)</b> $2.77/0.303 \approx 9.14$ trillion USD at US prices ⇒ <b>44.4 %</b> of US GDP.</p>
  <p><b>(c)</b> Prices (especially of non-tradables) are much lower in India, so each rupee buys more goods than the market exchange rate indicates. The PPP comparison values both countries' output at the same prices and is more informative about the <b>quantity</b> of goods and services produced; market rates are relevant for international purchasing power.</p>`, keys:["13,4 %","44,4 %","Prisnivåskillnad / icke-handlade varor"] },
{ id:"n2", t:"t1", src:"Prognos (PS1 Q2–3)", pts:15, q:R`2000→2025: GDP per capita grew 0.69 %/yr in Finland, 1.10 % in Sweden, 1.31 % in the US. Components (pp/yr): Finland Y/H 0.76, H/E −0.39, E/N<sup>wa</sup> 0.40, N<sup>wa</sup>/N −0.08; US 1.55, −0.06, −0.25, 0.08. Capital per hour grew 1.84 % (FI) and 1.82 % (US). (a) What explains Finland's slower growth? (b) Growth accounting with α = 1/3. (c) Is measured TFP technology?`,
  a:R`<p><b>(a)</b> Finland grew 0.62 pp/yr slower than the US. Main reason: productivity (Y/H) grew 0.79 pp slower; fewer hours per worker (−0.33 pp relative) also contributed; the rising employment rate (+0.65 pp relative to the US) offset part of the gap; the working-age share fell slightly (aging).</p>
  <p><b>(b)</b> $g_A = g_{Y/H} - \alpha g_{K/H}$. Finland: capital deepening $1.84/3 = 0.61$, TFP $0.76-0.61 = 0.15$. US: capital $0.61$, TFP $1.55-0.61 = 0.94$. (Sweden: Y/H 1.13, K/H 1.74 ⇒ capital 0.58, TFP 0.55.) Capital deepening was similar – the difference is almost entirely TFP.</p>
  <p><b>(c)</b> No – TFP is a residual and also reflects measurement error (e.g. quality adjustment, Nokia's collapse affecting sectoral composition), omitted inputs (human capital), capacity utilization, reallocation and organization. Accounting does not establish causality.</p>`, keys:["Produktivitet förklarar gapet","Sysselsättningsgraden motverkar","TFP-residual FI 0,15 vs US 0,94","Kapitalfördjupning lika","TFP ≠ teknik"] },
{ id:"n3", t:"t5", src:"Prognos (LN5a)", pts:5, q:R`An opposition leader says "100,000 more unemployed since 2022"; the government says "110,000 more employed since 2022". Can both be true? Discuss with the extended bathtub model.`,
  a:R`<p>Yes. Employment and unemployment are not complements: the population is E + U + O. If the labor force grows (population growth, higher participation via activation), both E and U can rise. In the extended bathtub model, a higher activation rate $a$ moves people from outside the labor force into unemployment; some subsequently find jobs, so both the number of employed and unemployed rise; the employment rate rises while $u^* = s/(s+f)$ is unchanged. With heterogeneity (newly activated workers have weaker attachment), both the employment rate and the unemployment rate can rise. Thus labor-market policy cannot be evaluated using the unemployment rate alone.</p>`, keys:["N = E + U + O","Arbetskraften växer","Aktivering i bathtub-modellen","Heterogenitet ⇒ båda kvoterna kan stiga"] },
{ id:"n4", t:"t9", src:"Prognos (LN8)", pts:10, q:R`Explain why banks are fragile, how a rise in risk premia affects the economy in IS–MP, and what central banks can do in a financial crisis. Use SVB (2023) as an example.`,
  a:R`<p><b>Fragility:</b> banks fund long-term, illiquid loans and bonds with short-term deposits that can be withdrawn quickly, with little equity. Losses threaten solvency; withdrawals create liquidity problems; the two reinforce each other in a run. SVB: rising rates reduced the market value of its long bond portfolio; concentrated, largely uninsured depositors ran; selling bonds would realize losses.</p>
  <p><b>IS–MP:</b> borrowing rate $r^b = r+\rho$ ⇒ $\tilde Y = \alpha-\beta(r+\rho-\bar r)$. A higher risk premium raises borrowing costs at an unchanged policy rate ⇒ demand and output fall; the central bank can lower $r$ to offset, unless constrained by the lower bound (GFC 2008: policy rate fell but the relevant borrowing rate rose).</p>
  <p><b>Interventions:</b> lender of last resort against collateral to solvent banks, market liquidity facilities, broader collateral, asset purchases (QE), credible communication; plus deposit insurance, capital and liquidity requirements. Complications: hard to judge solvency, moral hazard, fiscal risk.</p>`, keys:["Löptids- och likviditetstransformation","r + ρ i IS","SVB-mekanismen","LOLR, QE, regler, moral hazard"] },
{ id:"n5", t:"t10", src:"Prognos (LN9)", pts:5, q:R`MPC = 0.4. Government purchases rise by 20 at a fixed real interest rate. (a) Effect on output? (b) What if instead taxes are cut by 20? (c) Why might the effect be smaller in practice?`,
  a:R`<p><b>(a)</b> $\Delta Y = \frac{1}{1-0.4}\cdot 20 \approx 33$: first-round 20, then consumption rises by 8, then 3.2, … (geometric series).</p>
  <p><b>(b)</b> $\Delta Y = -\frac{MPC}{1-MPC}\Delta T = \frac{0.4}{0.6}\cdot 20 \approx 13$ – smaller because only the fraction MPC of the tax cut is spent initially.</p>
  <p><b>(c)</b> Monetary policy may raise rates (crowding out), imports leak demand abroad, Ricardian households save tax cuts, the economy may be near capacity (prices rise), risk premia may rise with debt. Larger at the ZLB and with high-MPC recipients.</p>`, keys:["≈ 33","≈ 13","Skäl till mindre multiplikator"] },
];

// Minimal SVG-diagram (inga beroenden). Färger via CSS-variabler.
const Charts = (() => {
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const niceTicks = (min, max, n = 5) => {
    if (min === max) { min -= 1; max += 1; }
    const span = max - min, step0 = span / n;
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || step0;
    const ticks = [];
    for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) ticks.push(+v.toFixed(10));
    return ticks;
  };
  const fmt = v => Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1).replace(/\.0$/, "") : (+v.toFixed(2)).toString();

  // series: [{name, pts:[[x,y]...], cls, dash, width}], opts: {xLabel,yLabel,xMin,xMax,yMin,yMax,hlines:[{y,label,cls}], vlines:[{x,label}], points:[{x,y,label,cls}], h}
  function plot(container, series, opts = {}) {
    container.innerHTML = "";
    const W = 560, H = opts.h || 300, m = { l: 48, r: 14, t: 14, b: 40 };
    const all = series.flatMap(s => s.pts).filter(p => isFinite(p[1]));
    let xMin = opts.xMin ?? Math.min(...all.map(p => p[0])), xMax = opts.xMax ?? Math.max(...all.map(p => p[0]));
    let yMin = opts.yMin ?? Math.min(...all.map(p => p[1]), ...(opts.hlines || []).map(h => h.y));
    let yMax = opts.yMax ?? Math.max(...all.map(p => p[1]), ...(opts.hlines || []).map(h => h.y));
    if (opts.yMin === undefined || opts.yMax === undefined) { const pad = (yMax - yMin) * 0.08 || 1; if (opts.yMin === undefined) yMin -= pad; if (opts.yMax === undefined) yMax += pad; }
    const X = x => m.l + (x - xMin) / (xMax - xMin) * (W - m.l - m.r);
    const Y = y => H - m.b - (y - yMin) / (yMax - yMin) * (H - m.t - m.b);
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", role: "img" }, container);
    const g = el("g", { class: "grid" }, svg);
    niceTicks(yMin, yMax).forEach(t => {
      el("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t) }, g);
      el("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end", class: "tick" }, g).textContent = fmt(t);
    });
    niceTicks(xMin, xMax, 6).filter(t => !opts.xInt || Number.isInteger(t)).forEach(t => {
      el("text", { x: X(t), y: H - m.b + 16, "text-anchor": "middle", class: "tick" }, g).textContent = fmt(t);
    });
    el("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, class: "axis" }, svg);
    el("line", { x1: m.l, x2: m.l, y1: m.t, y2: H - m.b, class: "axis" }, svg);
    if (yMin < 0 && yMax > 0) el("line", { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), class: "zero" }, svg);
    if (opts.xLabel) el("text", { x: (W + m.l) / 2, y: H - 6, "text-anchor": "middle", class: "lbl" }, svg).textContent = opts.xLabel;
    if (opts.yLabel) el("text", { x: 12, y: m.t + 4, class: "lbl" }, svg).textContent = opts.yLabel;
    (opts.vlines || []).forEach(v => {
      el("line", { x1: X(v.x), x2: X(v.x), y1: m.t, y2: H - m.b, class: "vline" }, svg);
      if (v.label) el("text", { x: X(v.x) + 4, y: m.t + 12, class: "lbl small" }, svg).textContent = v.label;
    });
    (opts.hlines || []).forEach(h => {
      el("line", { x1: m.l, x2: W - m.r, y1: Y(h.y), y2: Y(h.y), class: "hline " + (h.cls || "") }, svg);
      if (h.label) el("text", { x: W - m.r - 4, y: Y(h.y) - 5, "text-anchor": "end", class: "lbl small" }, svg).textContent = h.label;
    });
    const clip = el("clipPath", { id: "c" + Math.random().toString(36).slice(2) }, svg);
    el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b }, clip);
    series.forEach(s => {
      const d = s.pts.filter(p => isFinite(p[1])).map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("");
      el("path", { d, class: "line " + (s.cls || "s1"), "stroke-dasharray": s.dash || "", "stroke-width": s.width || 2.2, "clip-path": `url(#${clip.id})` }, svg);
      if (s.label) {
        const p = s.labelAt ? s.pts[Math.min(s.pts.length - 1, s.labelAt)] : s.pts[s.pts.length - 1];
        const ly = Math.max(m.t + 10, Math.min(H - m.b - 4, Y(p[1]) - 6));
        el("text", { x: Math.min(W - m.r - 2, X(p[0])), y: ly, "text-anchor": "end", class: "slbl " + (s.cls || "s1") }, svg).textContent = s.label;
      }
    });
    (opts.points || []).forEach(p => {
      el("circle", { cx: X(p.x), cy: Y(p.y), r: 4.5, class: "pt " + (p.cls || "") }, svg);
      if (p.label) el("text", { x: X(p.x) + 7, y: Y(p.y) - 7, class: "lbl" }, svg).textContent = p.label;
    });
    if (series.some(s => s.name)) {
      const lg = document.createElement("div"); lg.className = "legend";
      lg.innerHTML = series.filter(s => s.name).map(s => `<span><i class="sw ${s.cls || "s1"} ${s.dash ? "dashed" : ""}"></i>${s.name}</span>`).join("");
      container.appendChild(lg);
    }
    return svg;
  }
  return { plot };
})();

  <script>
// Interaktiva simulatorer: Solow och AS–AD (adaptiva / delvis förankrade förväntningar)
const Sim = (() => {

  // ---------------- SOLOW ----------------
  const SOLOW_SC = {
    base:   { label: "Ingen chock (steady state)", p: null },
    s_up:   { label: "Sparkvoten ökar (s↑)", p: "s", to: 0.30 },
    s_down: { label: "Sparkvoten minskar (s↓)", p: "s", to: 0.12 },
    n_down: { label: "Befolkningstillväxten faller (n↓)", p: "n", to: 0.0 },
    n_up:   { label: "Befolkningstillväxten ökar (n↑)", p: "n", to: 0.04 },
    d_down: { label: "Deprecieringen faller (δ↓)", p: "d", to: 0.05 },
    A_up:   { label: "TFP-nivån ökar 20 % (A↑)", p: "A", to: 1.2 },
  };
  const solowState = { s: 0.2, n: 0.02, d: 0.08, a: 1/3, A: 1, sc: "s_up", to: null };

  function solowSteady(p) { const k = Math.pow(p.s * p.A / (p.d + p.n), 1 / (1 - p.a)); return { k, y: p.A * Math.pow(k, p.a) }; }

  function solowRun(st) {
    const p0 = { s: st.s, n: st.n, d: st.d, a: st.a, A: st.A };
    const sc = SOLOW_SC[st.sc];
    const p1 = { ...p0 };
    if (sc.p) p1[sc.p] = st.to ?? sc.to;
    const T = 60, t0 = 5;
    let { k } = solowSteady(p0);
    const out = [];
    for (let t = 0; t <= T; t++) {
      const p = t < t0 ? p0 : p1;
      const y = p.A * Math.pow(k, p.a), c = (1 - p.s) * y;
      out.push({ t, k, y, c });
      k = ((1 - p.d) * k + p.s * y) / (1 + p.n);
    }
    return { p0, p1, out, t0 };
  }

  function solowRender(root, scenario) {
    if (scenario && SOLOW_SC[scenario]) { solowState.sc = scenario; solowState.to = null; }
    const st = solowState, sc = SOLOW_SC[st.sc];
    const toVal = st.to ?? sc.to;
    const rng = { s: [0.05, 0.45, 0.01], n: [0, 0.06, 0.005], d: [0.02, 0.15, 0.005], A: [0.6, 1.6, 0.05] };
    root.innerHTML = `
      <div class="sim-controls">
        <label>Scenario <select id="sc">${Object.entries(SOLOW_SC).map(([k, v]) => `<option value="${k}" ${k === st.sc ? "selected" : ""}>${v.label}</option>`).join("")}</select></label>
        ${sc.p ? `<label>Nytt värde på ${sc.p === "d" ? "δ" : sc.p}: <b id="tov">${toVal}</b><input type="range" id="to" min="${rng[sc.p][0]}" max="${rng[sc.p][1]}" step="${rng[sc.p][2]}" value="${toVal}"></label>` : ""}
        <label>Start-s: <b>${st.s}</b><input type="range" id="p_s" min="0.05" max="0.45" step="0.01" value="${st.s}"></label>
        <label>n: <b>${st.n}</b><input type="range" id="p_n" min="0" max="0.06" step="0.005" value="${st.n}"></label>
        <label>δ: <b>${st.d}</b><input type="range" id="p_d" min="0.02" max="0.15" step="0.005" value="${st.d}"></label>
        <label>α: <b>${st.a.toFixed(2)}</b><input type="range" id="p_a" min="0.2" max="0.6" step="0.01" value="${st.a}"></label>
      </div>
      <div class="sim-grid">
        <div class="card"><h4>Solowdiagrammet (per arbetare)</h4><div id="ch1"></div><p class="muted small">Heldragna = före chocken, streckade = efter. Steady state där $sy$ skär $(\\delta+n)k$.</p></div>
        <div class="card"><h4>Output och konsumtion per arbetare (index, t=0 → 100)</h4><div id="ch2"></div></div>
        <div class="card"><h4>Tillväxttakt i y per arbetare (%)</h4><div id="ch3"></div></div>
        <div class="card"><h4>Vad händer? (skriv så här på tentan)</h4><div id="txt"></div></div>
      </div>`;
    const R0 = solowRun(st), { p0, p1, out, t0 } = R0;
    const s0 = solowSteady(p0), s1 = solowSteady(p1);
    const kMax = Math.max(s0.k, s1.k) * 1.6;
    const grid = Array.from({ length: 80 }, (_, i) => kMax * i / 79);
    const changed = !!sc.p;
    const ser = [
      { name: "y = Akᵅ", pts: grid.map(k => [k, p0.A * Math.pow(k, p0.a)]), cls: "s3", width: 1.6 },
      { name: "sy (före)", pts: grid.map(k => [k, p0.s * p0.A * Math.pow(k, p0.a)]), cls: "s1" },
      { name: "(δ+n)k (före)", pts: grid.map(k => [k, (p0.d + p0.n) * k]), cls: "s2" },
    ];
    if (changed) {
      if (["s", "A"].includes(sc.p)) ser.push({ name: "sy (efter)", pts: grid.map(k => [k, p1.s * p1.A * Math.pow(k, p1.a)]), cls: "s1", dash: "6 4" });
      if (["n", "d"].includes(sc.p)) ser.push({ name: "(δ+n)k (efter)", pts: grid.map(k => [k, (p1.d + p1.n) * k]), cls: "s2", dash: "6 4" });
    }
    const pts = [{ x: s0.k, y: p0.s * s0.y, label: "k*" }];
    if (changed) pts.push({ x: s1.k, y: p1.s * s1.y, label: "k**", cls: "new" });
    Charts.plot(root.querySelector("#ch1"), ser, { xLabel: "k (kapital per arbetare)", yLabel: "y, sy, (δ+n)k", xMin: 0, yMin: 0, yMax: Math.max(s0.y, s1.y) * 1.25, points: pts });
    const y0 = out[0].y, c0 = out[0].c;
    Charts.plot(root.querySelector("#ch2"), [
      { name: "y", pts: out.map(o => [o.t, 100 * o.y / y0]), cls: "s1" },
      { name: "c", pts: out.map(o => [o.t, 100 * o.c / y0 * (y0 / c0)]), cls: "s4" },
    ], { xInt: true, xLabel: "tid", vlines: [{ x: t0, label: "chock" }], hlines: [{ y: 100, cls: "faint" }] });
    Charts.plot(root.querySelector("#ch3"), [
      { name: "g_y", pts: out.slice(1).map((o, i) => [o.t, 100 * (o.y / out[i].y - 1)]), cls: "s1" },
    ], { xInt: true, xLabel: "tid", vlines: [{ x: t0, label: "chock" }], hlines: [{ y: 0, cls: "faint" }] });
    const cJump = (out[t0].c / out[t0 - 1].c - 1) * 100, yLR = (s1.y / s0.y - 1) * 100;
    const cLR = ((1 - p1.s) * s1.y / ((1 - p0.s) * s0.y) - 1) * 100;
    const txt = !changed ? `<p>Ekonomin ligger i steady state: $k^*=${s0.k.toFixed(2)}$, $y^*=${s0.y.toFixed(2)}$. Investeringen $sy$ täcker exakt break-even $(\\delta+n)k$.</p>` :
      `<ul>
        <li><b>Impact (t=${t0}):</b> $k$ är predetermined. ${sc.p === "A" ? "y hoppar direkt eftersom A ökar." : "y ändras inte direkt."} Konsumtionen ändras med <b>${cJump.toFixed(1)} %</b>${sc.p === "s" ? (cJump < 0 ? " – hoppar ned eftersom en större andel sparas." : " – hoppar upp eftersom en mindre andel sparas.") : "."}</li>
        <li><b>Övergång:</b> ${s1.k > s0.k ? "investeringen överstiger break-even ⇒ k och y stiger" : "investeringen understiger break-even ⇒ k och y faller"}; tillväxttakten avtar mot noll p.g.a. <b>avtagande MPK</b>.</li>
        <li><b>Lång sikt:</b> $y^*$ ändras med <b>${yLR.toFixed(1)} %</b>, konsumtion per arbetare med <b>${cLR.toFixed(1)} %</b>. Tillväxt per arbetare = 0; aggregerad tillväxt = n = ${p1.n}.</li>
        ${sc.p === "s" ? `<li>Golden rule: $s_{gold}=\\alpha=${p0.a.toFixed(2)}$. ${p1.s > p0.a && p0.s < p0.a ? "Nya s ligger över golden rule ⇒ konsumtionen kan bli lägre på sikt." : ""}</li>` : ""}
      </ul>`;
    root.querySelector("#txt").innerHTML = txt;
    const bind = (id, key, num = true) => { const e = root.querySelector(id); if (e) e.oninput = () => { st[key] = num ? +e.value : e.value; solowRender(root); }; };
    root.querySelector("#sc").onchange = e => { st.sc = e.target.value; st.to = null; solowRender(root); };
    if (root.querySelector("#to")) root.querySelector("#to").oninput = e => { st.to = +e.target.value; solowRender(root); };
    bind("#p_s", "s"); bind("#p_n", "n"); bind("#p_d", "d"); bind("#p_a", "a");
    App.math(root);
  }

  // ---------------- AS–AD ----------------
  const ASAD_SC = {
    demand_pos:      { label: "Tillfällig positiv efterfrågechock (1 period)", init: 2, f: t => ({ a: t === 1 ? 2 : 0, s: 0, ps: 2 }) },
    demand_neg:      { label: "Negativ efterfrågechock (3 perioder)", init: 2, f: t => ({ a: t >= 1 && t <= 3 ? -2 : 0, s: 0, ps: 2 }) },
    demand_temp_neg: { label: "Utländsk räntesänkning → appreciering → NX↓ (4 perioder)", init: 2, f: t => ({ a: t >= 1 && t <= 4 ? -1.5 : 0, s: 0, ps: 2 }) },
    demand_perm:     { label: "Permanent positiv efterfrågechock", init: 2, f: t => ({ a: t >= 1 ? 1.5 : 0, s: 0, ps: 2 }) },
    cost:            { label: "Tillfällig kostnadschock (energi, 1 period)", init: 2, f: t => ({ a: 0, s: t === 1 ? 2 : 0, ps: 2 }) },
    cost_persist:    { label: "Ihållande kostnadschock (löner, 3 perioder)", init: 2, f: t => ({ a: 0, s: t >= 1 && t <= 3 ? 1 : 0, ps: 2 }) },
    target_down:     { label: "Sänkt inflationsmål 4 % → 2 %", init: 4, f: t => ({ a: 0, s: 0, ps: t >= 1 ? 2 : 4 }) },
    target_up:       { label: "Höjt inflationsmål 2 % → 4 %", init: 2, f: t => ({ a: 0, s: 0, ps: t >= 1 ? 4 : 2 }) },
  };
  const asadState = { sc: "target_down", beta: 1, mu: 0.5, kappa: 0.3, theta: 0, rbar: 2, sel: 1 };

  function asadRun(st) {
    const sc = ASAD_SC[st.sc], T = 14, bm = st.beta * st.mu;
    let piPrev = sc.init;
    const out = [{ t: 0, pi: sc.init, Y: 0, pe: sc.init, ps: sc.init, a: 0, s: 0, i: st.rbar + sc.init, r: st.rbar }];
    for (let t = 1; t <= T; t++) {
      const { a, s, ps } = sc.f(t);
      const pe = st.theta * ps + (1 - st.theta) * piPrev;
      const pi = (pe + st.kappa * a + st.kappa * bm * ps + s) / (1 + st.kappa * bm);
      const Y = a - bm * (pi - ps);
      const r = st.rbar + st.mu * (pi - ps);
      out.push({ t, pi, Y, pe, ps, a, s, r, i: r + pe });
      piPrev = pi;
    }
    return out;
  }

  function asadRender(root, scenario) {
    if (scenario && ASAD_SC[scenario]) asadState.sc = scenario;
    const st = asadState;
    root.innerHTML = `
      <div class="sim-controls">
        <label>Scenario <select id="sc">${Object.entries(ASAD_SC).map(([k, v]) => `<option value="${k}" ${k === st.sc ? "selected" : ""}>${v.label}</option>`).join("")}</select></label>
        <label>Förankring θ (0 = adaptiva, 1 = fullt trovärdigt mål): <b>${st.theta}</b><input type="range" id="th" min="0" max="1" step="0.1" value="${st.theta}"></label>
        <label>μ (penningpolitikens aggressivitet): <b>${st.mu}</b><input type="range" id="mu" min="0.1" max="2" step="0.1" value="${st.mu}"></label>
        <label>κ (Phillipskurvans lutning): <b>${st.kappa}</b><input type="range" id="ka" min="0.05" max="1" step="0.05" value="${st.kappa}"></label>
        <label>Visa AS–AD för period: <b>${st.sel}</b><input type="range" id="sel" min="1" max="8" step="1" value="${st.sel}"></label>
      </div>
      <p class="muted small">${String.raw`Modell: AD $\tilde Y_t=\alpha_t-\beta\mu(\pi_t-\pi^*_t)$, AS $\pi_t=\pi^e_t+\kappa\tilde Y_t+\sigma_t$, förväntningar $\pi^e_t=\theta\pi^*_t+(1-\theta)\pi_{t-1}$, nominell ränta $i_t=\bar r+\mu(\pi_t-\pi^*_t)+\pi^e_t$.`}</p>
      <div class="sim-grid">
        <div class="card"><h4>AS–AD-diagram, period ${st.sel} (streckat = period ${st.sel - 1})</h4><div id="ch0"></div></div>
        <div class="card"><h4>Inflation och förväntningar (%)</h4><div id="ch1"></div></div>
        <div class="card"><h4>Output gap (%)</h4><div id="ch2"></div></div>
        <div class="card"><h4>Nominell styrränta och realränta (%)</h4><div id="ch3"></div></div>
      </div>
      <div class="card"><h4>Period för period</h4><div id="tbl"></div></div>`;
    const out = asadRun(st), bm = st.beta * st.mu;
    const T = out.map(o => o.t);
    Charts.plot(root.querySelector("#ch1"), [
      { name: "π", pts: out.map(o => [o.t, o.pi]), cls: "s1" },
      { name: "πᵉ (förväntad)", pts: out.map(o => [o.t, o.pe]), cls: "s3", dash: "5 4" },
      { name: "π* (mål)", pts: out.map(o => [o.t, o.ps]), cls: "s2", width: 1.4 },
    ], { xInt: true, xLabel: "period", vlines: [{ x: 1, label: "chock" }] });
    Charts.plot(root.querySelector("#ch2"), [{ name: "Ỹ", pts: out.map(o => [o.t, o.Y]), cls: "s4" }], { xInt: true, xLabel: "period", hlines: [{ y: 0, cls: "faint" }], vlines: [{ x: 1 }] });
    Charts.plot(root.querySelector("#ch3"), [
      { name: "i (nominell)", pts: out.map(o => [o.t, o.i]), cls: "s1" },
      { name: "r (real)", pts: out.map(o => [o.t, o.r]), cls: "s2", dash: "5 4" },
    ], { xInt: true, xLabel: "period", vlines: [{ x: 1 }] });
    // AS–AD diagram
    const o = out[st.sel], p = out[st.sel - 1];
    const ys = [-4, 4];
    const grid = Array.from({ length: 41 }, (_, i) => ys[0] + (ys[1] - ys[0]) * i / 40);
    const ad = q => grid.map(Y => [Y, q.ps + (q.a - Y) / bm]);
    const as = q => grid.map(Y => [Y, q.pe + st.kappa * Y + q.s]);
    const piAll = out.map(q => q.pi);
    Charts.plot(root.querySelector("#ch0"), [
      { name: `AD${st.sel - 1}`, pts: ad(p), cls: "s1", dash: "5 4", width: 1.5 },
      { name: `AS${st.sel - 1}`, pts: as(p), cls: "s2", dash: "5 4", width: 1.5 },
      { name: `AD${st.sel}`, pts: ad(o), cls: "s1", label: `AD${st.sel}`, labelAt: 4 },
      { name: `AS${st.sel}`, pts: as(o), cls: "s2", label: `AS${st.sel}` },
    ], { xLabel: "Ỹ (output gap)", yLabel: "π", xMin: ys[0], xMax: ys[1], yMin: Math.min(...piAll) - 2, yMax: Math.max(...piAll) + 2,
         hlines: [{ y: o.ps, label: "π*", cls: "faint" }],
         points: [{ x: p.Y, y: p.pi, label: String.fromCharCode(64 + st.sel) }, { x: o.Y, y: o.pi, label: String.fromCharCode(65 + st.sel), cls: "new" }] });
    root.querySelector("#tbl").innerHTML = `<table class="tbl num"><tr><th>t</th><th>π*</th><th>πᵉ</th><th>π</th><th>Ỹ</th><th>r</th><th>i</th></tr>` +
      out.slice(0, 9).map(q => `<tr${q.t === st.sel ? ' class="hl"' : ""}><td>${q.t}</td><td>${q.ps.toFixed(1)}</td><td>${q.pe.toFixed(2)}</td><td>${q.pi.toFixed(2)}</td><td>${q.Y.toFixed(2)}</td><td>${q.r.toFixed(2)}</td><td>${q.i.toFixed(2)}</td></tr>`).join("") + `</table>`;
    root.querySelector("#sc").onchange = e => { st.sc = e.target.value; asadRender(root); };
    const b = (id, k) => root.querySelector(id).oninput = e => { st[k] = +e.target.value; asadRender(root); };
    b("#th", "theta"); b("#mu", "mu"); b("#ka", "kappa"); b("#sel", "sel");
    App.math(root);
  }

  return { solowRender, asadRender, SOLOW_SC, ASAD_SC };
})();
